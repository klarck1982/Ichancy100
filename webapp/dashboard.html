<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👑 لوحة تحكم القيصر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
  :root{
    --bg:#070a12;
    --bg2:#0d111c;
    --text:#f5f5f5;
    --hint:#8b95a7;
    --link:#5b9bf5;
    --card:rgba(255,255,255,0.03);
    --gold:#ffd700;
    --gold-2:#ffb700;
    --green:#00d68f;
    --green-bg:rgba(0,214,143,0.08);
    --red:#ff4757;
    --red-bg:rgba(255,71,87,0.08);
    --orange:#ffa502;
    --blue:#4a9eff;
    --blue-bg:rgba(74,158,255,0.08);
    --purple:#a55eea;
    --line:rgba(255,255,255,0.06);
    --shadow:0 8px 32px rgba(0,0,0,0.4);
    --radius:20px;
  }
  body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;overflow-x:hidden}

  /* خلفية متوهّجة */
  body::before{
    content:'';position:fixed;top:-150px;right:-100px;width:500px;height:500px;
    background:radial-gradient(circle,rgba(255,215,0,0.06) 0%,transparent 70%);
    pointer-events:none;z-index:0
  }
  body::after{
    content:'';position:fixed;bottom:-150px;left:-100px;width:400px;height:400px;
    background:radial-gradient(circle,rgba(74,158,255,0.05) 0%,transparent 70%);
    pointer-events:none;z-index:0
  }

  /* ===== الشريط العلوي ===== */
  .top-bar{
    background:rgba(7,10,18,0.85);backdrop-filter:blur(20px);
    padding:16px 20px;position:sticky;top:0;z-index:100;
    border-bottom:1px solid var(--line)
  }
  .top-bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top-bar h1{
    font-size:20px;font-weight:900;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:-0.5px
  }
  .top-bar .time{color:var(--hint);font-size:11px}
  .search-bar{display:flex;gap:8px}
  .search-bar input{
    flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:10px 16px;font-size:14px;outline:none;
    transition:all 0.2s
  }
  .search-bar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,0.1)}
  .search-bar button{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#070a12;border:none;border-radius:14px;padding:10px 18px;
    font-size:13px;font-weight:900;cursor:pointer;transition:all 0.2s
  }
  .search-bar button:active{transform:scale(0.96)}

  /* ===== شريط التنبيهات ===== */
  .alerts-bar{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
  .alerts-bar::-webkit-scrollbar{display:none}
  .alert-chip{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);
    border:1px solid var(--line);border-radius:24px;padding:8px 14px;
    font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all 0.2s
  }
  .alert-chip:active{transform:scale(0.96)}
  .alert-chip.warning{background:rgba(255,165,2,0.12);border-color:rgba(255,165,2,0.3);color:var(--orange)}
  .alert-chip.danger{background:rgba(255,71,87,0.12);border-color:rgba(255,71,87,0.3);color:var(--red)}
  .alert-chip .badge{
    background:var(--red);color:#fff;padding:2px 8px;border-radius:12px;
    font-size:10px;font-weight:900
  }

  /* ===== المحتوى ===== */
  .content{padding:16px 20px;position:relative;z-index:1}

  /* ===== البطاقات ===== */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:16px;
    box-shadow:var(--shadow);backdrop-filter:blur(10px);
    transition:all 0.3s
  }
  .card-title{
    font-size:15px;font-weight:900;color:var(--text);margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between
  }
  .card-title .see-all{
    color:var(--hint);font-size:12px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:12px;
    transition:all 0.2s
  }
  .card-title .see-all:active{transform:scale(0.95)}
  .sub{color:var(--hint);font-size:13px;line-height:1.6;margin-bottom:10px}

  /* ===== شبكة الإحصائيات ===== */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat-box{
    background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.03);
    border-radius:16px;padding:14px;text-align:center;transition:all 0.2s
  }
  .stat-box .icon{font-size:24px;margin-bottom:6px}
  .stat-label{font-size:11px;color:var(--hint);font-weight:600}
  .stat-value{font-size:20px;font-weight:900;margin-top:4px;letter-spacing:-0.5px}
  .gold{color:var(--gold)}
  .green{color:var(--green)}
  .red{color:var(--red)}
  .blue{color:var(--blue)}
  .pill{display:inline-block;background:var(--blue-bg);color:var(--blue);padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill.gold{background:rgba(255,215,0,0.1);color:var(--gold)}

  /* ===== شريط الحالة ===== */
  .status-bar{display:flex;gap:8px;flex-wrap:wrap}
  .status-item{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.03);
    border-radius:12px;padding:8px 12px;font-size:12px
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.ok{background:var(--green);box-shadow:0 0 8px rgba(0,214,143,0.4)}
  .dot.bad{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,0.4)}
  .dot.warn{background:var(--orange);box-shadow:0 0 8px rgba(255,165,2,0.4)}

  /* ===== الطلبات ===== */
  .row{
    display:flex;justify-content:space-between;gap:10px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px
  }
  .row:last-child{border:none}
  .label{color:var(--hint);font-weight:600}
  .value{font-weight:800;text-align:left;direction:ltr}
  .badge{background:var(--red);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:900}
  .badge.green{background:var(--green)}
  .pending-item{
    background:var(--red-bg);border-right:3px solid var(--red);
    border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px
  }
  .tx-id{color:var(--link);font-weight:900}
  .empty{text-align:center;color:var(--hint);padding:24px;font-size:14px}
  .recent-list{font-size:13px}
  .recent-list .item{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid var(--line)
  }
  .recent-list .item:last-child{border:none}

  /* ===== الطلبات المحسّنة ===== */
  .request-item{
    display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);
    border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px;
    transition:all 0.2s
  }
  .request-item:active{transform:scale(0.98);background:rgba(255,255,255,0.05)}
  .request-item .req-icon{
    width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0
  }
  .request-item .req-icon.deposit{background:var(--green-bg)}
  .request-item .req-icon.withdraw{background:var(--red-bg)}
  .request-item .req-info{flex:1;min-width:0}
  .request-item .req-info .req-title{font-size:13px;font-weight:700}
  .request-item .req-info .req-sub{font-size:11px;color:var(--hint);margin-top:2px}
  .request-item .req-amount{text-align:left;direction:ltr}
  .request-item .req-amount .req-value{font-size:15px;font-weight:900}
  .request-item .req-amount .req-time{font-size:11px;color:var(--hint)}
  .request-item .req-actions{display:flex;gap:5px}
  .request-item .req-actions button{
    width:36px;height:36px;border-radius:12px;border:none;font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s
  }
  .request-item .req-actions .accept{background:var(--green-bg);color:var(--green)}
  .request-item .req-actions .reject{background:var(--red-bg);color:var(--red)}

  /* ===== الرسائل ===== */
  .message-item{
    display:flex;gap:12px;background:rgba(255,255,255,0.03);
    border-radius:14px;padding:12px;margin-top:8px
  }
  .message-item .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--blue-bg);
    display:flex;align-items:center;justify-content:center;font-size:16px
  }
  .message-item .msg-content{flex:1}
  .message-item .msg-content .msg-name{font-size:12px;font-weight:700}
  .message-item .msg-content .msg-text{font-size:11px;color:var(--hint);margin-top:2px}
  .message-item .msg-time{font-size:11px;color:var(--hint)}

  /* ===== الأزرار ===== */
  .btn{
    width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#070a12;border:none;padding:14px;border-radius:16px;
    font-size:15px;font-weight:900;cursor:pointer;margin-top:8px;
    transition:all 0.2s;box-shadow:0 4px 16px rgba(255,215,0,0.15)
  }
  .btn:active{transform:scale(0.98)}
  .btn.outline{background:transparent;border:1px solid var(--gold);color:var(--gold);box-shadow:none}
  .btn.danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,71,87,0.3);box-shadow:none}
  .btn.green{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,214,143,0.3);box-shadow:none}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  /* ===== الأزرار السريعة ===== */
  .quick-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .action-btn{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);
    border-radius:16px;padding:16px 8px;cursor:pointer;transition:all 0.2s
  }
  .action-btn:active{transform:scale(0.95);background:rgba(255,215,0,0.08);border-color:rgba(255,215,0,0.2)}
  .action-btn .action-icon{font-size:26px}
  .action-btn .action-label{font-size:11px;font-weight:700;text-align:center}

  /* ===== الإدخال ===== */
  input,textarea,select{
    width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:12px 16px;font-size:14px;
    outline:none;margin-top:6px;transition:all 0.2s
  }
  textarea{min-height:80px;resize:vertical;direction:ltr;text-align:left}
  input:focus,textarea:focus,select:focus{
    border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,0.08)
  }
  .field{margin-bottom:12px}
  .field label{font-size:12px;color:var(--hint);font-weight:800}
  .hint{font-size:11px;color:var(--hint);margin-top:4px;line-height:1.5}
  .cookie-status{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
  .cookie-status.ok{color:var(--green)}.cookie-status.bad{color:var(--red)}.cookie-status.warn{color:var(--orange)}

  /* ===== التنبيهات ===== */
  .loader{text-align:center;padding:60px 20px;color:var(--hint)}
  .spinner{
    width:40px;height:40px;border:3px solid rgba(255,215,0,0.15);
    border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{
    background:var(--red-bg);border:1px solid rgba(255,71,87,0.2);color:var(--red);
    border-radius:16px;padding:16px;text-align:center;font-size:14px;line-height:1.7
  }
  .success-box{
    background:var(--green-bg);border:1px solid rgba(0,214,143,0.2);color:var(--green);
    border-radius:16px;padding:12px;text-align:center;font-size:13px;margin-bottom:10px;font-weight:900
  }
  .warn-box{
    background:rgba(255,165,2,0.08);border:1px solid rgba(255,165,2,0.2);color:var(--orange);
    border-radius:16px;padding:12px;font-size:12px;line-height:1.7;margin-bottom:10px
  }

  /* ===== شريط التنقّل السفلي ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(7,10,18,0.95);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 0 16px;z-index:100
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    color:var(--hint);font-size:10px;font-weight:700;transition:all 0.2s;background:none;border:none
  }
  .nav-item.active{color:var(--gold)}
  .nav-item .nav-icon{font-size:22px}
  .nav-item .nav-badge{position:absolute;top:-2px;right:2px;background:var(--red);color:#fff;padding:1px 5px;border-radius:12px;font-size:9px;font-weight:900}

</style>
</head>
<body>

<!-- ===== الشريط العلوي ===== -->
<div class="top-bar">
  <div class="top-bar-header">
    <h1>👑 لوحة تحكم القيصر</h1>
    <span class="time" id="lastUpdate">جارٍ التحميل...</span>
  </div>
  <div class="search-bar">
    <input type="text" id="globalSearch" placeholder="🔍 بحث عن مستخدم أو طلب...">
    <button onclick="doGlobalSearch()">بحث</button>
  </div>
</div>

<!-- ===== شريط التنبيهات ===== -->
<div class="alerts-bar" id="alertsBar"></div>

<!-- ===== المحتوى الرئيسي ===== -->
<div id="notice"></div>
<div class="content" id="content">
  <div class="loader"><div class="spinner"></div>جارٍ تحميل البيانات...</div>
</div>

<!-- ===== شريط التنقل السفلي ===== -->
<div class="bottom-nav">
  <div class="nav-item active" id="navDash" onclick="showTab('dashboard')">
    <div class="nav-icon">🏠</div>
    <span>الرئيسية</span>
  </div>
  <div class="nav-item" id="navRequests" onclick="showTab('requests')" style="position:relative">
    <div class="nav-icon">📥</div>
    <span>الطلبات</span>
    <span class="nav-badge" id="pendingBadge" style="display:none">0</span>
  </div>
  <div class="nav-item" id="navSupport" onclick="showTab('support')" style="position:relative">
    <div class="nav-icon">📩</div>
    <span>الدعم</span>
  </div>
  <div class="nav-item" id="navUsers" onclick="showTab('users')">
    <div class="nav-icon">👥</div>
    <span>المستخدمون</span>
  </div>
  <div class="nav-item" id="navMore" onclick="showTab('more')">
    <div class="nav-icon">⚙️</div>
    <span>المزيد</span>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : {initData:'',ready(){},expand(){},showPopup(o){alert(o.message||o.title)},showConfirm(m,cb){cb(confirm(m))}};
const API = window.location.origin;
const DASH_API = API + '/api/dashboard';
const SETTINGS_API = API + '/api/admin/settings';
const FINANCE_API = API + '/api/admin/agent-finance';
const HEALTH_API = API + '/api/admin/health';
const NEON_API = API + '/api/admin/neon';
const RENDER_API = API + '/api/admin/render';
const BROADCAST_API = API + '/api/admin/broadcast';
const BROADCASTS_API = API + '/api/admin/broadcasts';
const USERS_API = API + '/api/admin/users';
const REQUESTS_API = API + '/api/admin/requests';
const SUPPORT_API = API + '/api/admin/support';
const BONUSES_API = API + '/api/admin/bonuses';
const PREDICTIONS_API = API + '/api/admin/predictions';
const CONTESTS_API = API + '/api/admin/contests';

let initData = tg.initData || '';
let currentTab = 'dashboard';
let dashboardData = null;
let settingsData = null;
tg.ready(); tg.expand();

function fmt(n){return new Intl.NumberFormat('en-US').format(Number(n||0));}
function val(id){return document.getElementById(id)?.value || '';}
function setNotice(msg,type='success'){const el=document.getElementById('notice');el.innerHTML=msg?`<div class="${type==='error'?'error-box':'success-box'}">${msg}</div>`:''; if(msg)setTimeout(()=>{el.innerHTML=''},3500)}
function statusEmoji(s){return s==='approved'?'🟢':s==='pending'?'🟡':'🔴'}

// ===== التنقل =====
function setNavActive(tab){
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  const map={dashboard:'navDash',requests:'navRequests',support:'navSupport',users:'navUsers'};
  const navId=map[tab]||'navMore';
  document.getElementById(navId)?.classList.add('active');
}

function showTab(tab){
  currentTab=tab;
  setNavActive(tab);
  document.getElementById('notice').innerHTML='';
  if(tab==='dashboard')loadDashboard();
  else if(tab==='users')loadUsers();
  else if(tab==='requests')loadRequests();
  else if(tab==='support')loadSupport();
  else if(tab==='finance')loadFinance();
  else if(tab==='health')loadHealth();
  else if(tab==='broadcast')loadBroadcast();
  else if(tab==='bonuses')loadBonuses();
  else if(tab==='predictions')loadPredictions();
  else if(tab==='contests')loadContests();
  else if(tab==='features')loadFeatures();
  else if(tab==='more')loadMoreMenu();
  else loadSettings(tab);
}

function reloadCurrent(){showTab(currentTab);}

// ===== API =====
async function apiGet(url){const res=await fetch(url,{headers:{'X-Telegram-Init-Data':initData}});if(!res.ok)throw new Error('HTTP '+res.status);return await res.json();}
async function apiPost(url,payload){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||('HTTP '+res.status));return data;}

// ===== البحث العام =====
function doGlobalSearch(){
  const q=document.getElementById('globalSearch').value.trim();
  if(!q)return;
  showTab('users');
  setTimeout(()=>{
    document.getElementById('user_search_q').value=q;
    searchUsers();
  },300);
}

// ===== تحديث شريط التنبيهات =====
function updateAlertsBar(d){
  const bar=document.getElementById('alertsBar');
  let html='';
  const dep=d.pending_deposits?.length||0;
  const wit=d.pending_withdraws?.length||0;
  if(dep>0)html+=`<div class="alert-chip danger" onclick="showTab('requests')"><span>📥</span><span>${dep} طلبات إيداع</span><span class="badge">${dep}</span></div>`;
  if(wit>0)html+=`<div class="alert-chip warning" onclick="showTab('requests')"><span>📤</span><span>${wit} طلبات سحب</span><span class="badge">${wit}</span></div>`;
  html+=`<div class="alert-chip" onclick="showTab('support')"><span>📩</span><span>الدعم</span></div>`;
  html+=`<div class="alert-chip" onclick="showTab('contests')"><span>👑</span><span>المسابقات</span></div>`;
  html+=`<div class="alert-chip" onclick="showTab('predictions')"><span>🎫</span><span>التوقعات</span></div>`;
  bar.innerHTML=html;
  
  // تحديث شارة الطلبات المعلقة
  const total=dep+wit;
  const badge=document.getElementById('pendingBadge');
  if(total>0){badge.textContent=total;badge.style.display='block';}
  else{badge.style.display='none';}
}

// ===== الرئيسية =====
async function loadDashboard(){
  currentTab='dashboard';setNavActive('dashboard');
  const el=document.getElementById('content');
  el.innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل البيانات...</div>';
  try{
    dashboardData=await apiGet(DASH_API);
    renderDashboard(dashboardData);
    document.getElementById('lastUpdate').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');
  }catch(e){
    el.innerHTML='<div class="error-box">⚠️ تعذّر تحميل البيانات.<br>تأكد من أنك فتحت اللوحة من زر الأدمن في البوت.</div>';
  }
}

function renderDashboard(d){
  const cookieAge=d.cookie_age_minutes;
  let cookieAgeText='—';let cookieClass='ok';
  if(cookieAge===null){cookieClass='warn';cookieAgeText='لم يُحدّث بعد'}
  else if(cookieAge<60)cookieAgeText=cookieAge+' دقيقة';
  else if(cookieAge<1440)cookieAgeText=Math.floor(cookieAge/60)+' ساعة';
  else{cookieAgeText=Math.floor(cookieAge/1440)+' يوم';cookieClass='warn'}
  
  const cookieStatus=d.is_cookie_alive?'🟢 نشطة':'🔴 منتهية';
  const cookieStatusClass=d.is_cookie_alive?(cookieAge!==null&&cookieAge>=720?'warn':'ok'):'bad';

// 🆕 (Update 19) رسم بياني مبسط (Sparkline)
function renderSparkline(deposits,withdraws,labels){
  const max=Math.max(...deposits,...withdraws,1);
  const w=300,h=80,pad=10;
  const n=deposits.length;
  const step=(w-pad*2)/(n-1);
  
  function points(arr){
    return arr.map((v,i)=>`${pad+i*step},${h-pad-(v/max)*(h-pad*2)}`).join(' ');
  }
  
  return `
    <div class="card">
      <div class="card-title"><span>📈 حركة 7 أيام</span></div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
        <polyline points="${points(deposits)}" fill="none" stroke="var(--green)" stroke-width="2"/>
        <polyline points="${points(withdraws)}" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="4"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--hint);margin-top:4px">
        <span>🟢 إيداعات</span>
        <span>🔴 سحوبات</span>
      </div>
    </div>
  `;
}

async function loadHealth(){currentTab='health';setNavActive('more');const el=document.getElementById('content');el.innerHTML='<div class="loader"><div class="spinner"></div>جارٍ فحص حالة النظام...</div>';try{const [hRes,nRes,rRes]=await Promise.allSettled([apiGet(HEALTH_API),apiGet(NEON_API),apiGet(RENDER_API)]);if(hRes.status!=='fulfilled')throw (hRes.reason||new Error('health failed'));const neon=(nRes.status==='fulfilled')?nRes.value:{ok:false,error:(nRes.reason&&nRes.reason.message)||'تعذر جلب مقاييس Neon'};const render=(rRes.status==='fulfilled')?rRes.value:{ok:false,error:(rRes.reason&&rRes.reason.message)||'تعذر جلب حالة Render'};renderHealth(hRes.value,neon,render);document.getElementById('lastUpdate').textContent='آخر فحص: '+new Date().toLocaleTimeString('ar-EG');}catch(e){el.innerHTML=`<div class="error-box">⚠️ تعذر فحص النظام.<br>${e.message}</div>`}}

function okBadge(x){return x?'<span class="badge green">سليم</span>':'<span class="badge">مشكلة</span>'}
// شريط نسبة استخدام Neon مع تلوّن حسب العتبة
function neonBar(label,used,limit,unit,pct){pct=(typeof pct==='number')?pct:0;const color=pct>=90?'#e5484d':(pct>=70?'#e5a54d':'#30a46c');const w=Math.max(0,Math.min(100,pct));return `<div class="row"><span class="label">${label}</span><span class="value">${(used||0).toLocaleString('en-US',{maximumFractionDigits:3})} / ${limit} ${unit} <b style="color:${color}">${pct}%</b></span></div><div style="background:rgba(255,255,255,.08);border-radius:6px;height:8px;overflow:hidden;margin:4px 0 10px"><div style="height:100%;width:${w}%;background:${color};border-radius:6px;transition:width .4s"></div></div>`}
function neonCard(n){
  if(!n||n.ok===false){const reason=(n&&(n.error||n.refresh_error))||'غير متاح';const notConfigured=n&&n.configured===false;return `<div class="card"><div class="card-title">🗄️ Neon Database</div><div class="warn-box">${notConfigured?'⚙️ لم تُضبط متغيرات Neon (NEON_API_KEY / NEON_PROJECT_ID).':'⚠️ تعذّر جلب مقاييس Neon:'}<br>${reason}</div></div>`}
  const p=n.usage_percent||{},lim=n.limits||{};const overall=p.overall||0;
  const statusTxt=overall>=90?'🔴 قريب من الحد الأقصى':(overall>=70?'🟡 يقترب من الحد':'🟢 ضمن الحدود الآمنة');
  const staleTag=(n.cache&&n.cache.stale)?'<span class="badge" style="margin-inline-start:6px">بيانات مخزّنة</span>':'';
  const alert=overall>=70?`<div class="warn-box">⚠️ الاستخدام الكلي ${overall}% — يُنصح بالمراقبة${overall>=90?' أو الترقية':''}.</div>`:'';
  return `<div class="card"><div class="card-title"><span>🗄️ Neon Database</span><span class="value" style="font-size:.8rem">${statusTxt}${staleTag}</span></div>
  ${alert}
  ${neonBar('🧮 Compute',n.compute_hours,lim.compute_cu_hours||100,'ساعة',p.compute)}
  ${neonBar('💾 Storage',n.storage_gb,lim.storage_gb||0.5,'GB',p.storage)}
  ${neonBar('🌐 Transfer',n.transfer_gb,lim.transfer_gb||5,'GB',p.transfer)}
  <div class="row"><span class="label">🌿 عدد الفروع</span><span class="value">${(typeof n.branches_count==='number')?n.branches_count:'—'}</span></div>
  <div class="row"><span class="label">🔄 دورة الاستهلاك منذ</span><span class="value">${n.hours_elapsed?Math.round(n.hours_elapsed)+' ساعة':'—'}</span></div>
  </div>`
}
function renderRenderCard(r){
  if(!r||r.ok===false){const reason=(r&&(r.error||r.refresh_error))||'غير متاح';const notConfigured=r&&r.configured===false;return `<div class="card"><div class="card-title">☁️ Render</div><div class="warn-box">${notConfigured?'⚙️ لم تُضبط متغيرات Render (RENDER_API_KEY / RENDER_SERVICE_ID).':'⚠️ تعذّر جلب حالة Render:'}<br>${reason}</div></div>`}
  const suspended=r.suspended===true;
  const statusBadge=suspended?'<span class="badge">🔴 معلّقة</span>':'<span class="badge green">🟢 نشطة</span>';
  const dep=r.last_deploy||{};
  const depColor=dep.status==='live'?'#30a46c':(dep.status&&dep.status.indexOf('fail')>=0?'#e5484d':'');
  const staleTag=(r.cache&&r.cache.stale)?'<span class="badge" style="margin-inline-start:6px">بيانات مخزّنة</span>':'';
  const suspendAlert=suspended?'<div class="warn-box">🔴 الخدمة معلّقة (قد تكون ساعات التشغيل المجانية نفدت). راجع لوحة Render.</div>':'';
  const bw=(typeof r.bandwidth_24h_mb==='number')?`<div class="row"><span class="label">🌐 النطاق (24 ساعة)</span><span class="value">${r.bandwidth_24h_mb} MB</span></div>`:(r.bandwidth_note?`<div class="row"><span class="label">🌐 النطاق</span><span class="value" style="font-size:.8rem">${r.bandwidth_note}</span></div>`:'');
  const probe=r.probe?`<div class="row"><span class="label">⚡ الاستجابة</span><span class="value">${r.probe.state==='cold_start'?'❄️ استيقاظ ('+r.probe.latency_ms+'ms)':(r.probe.state==='warm'?'✅ نشطة ('+r.probe.latency_ms+'ms)':'⚠️ غير متصلة')}</span></div>`:'';
  return `<div class="card"><div class="card-title"><span>☁️ Render</span><span>${statusBadge}${staleTag}</span></div>
  ${suspendAlert}
  <div class="row"><span class="label">📛 الخدمة</span><span class="value">${r.name||'—'}</span></div>
  <div class="row"><span class="label">💳 الخطة</span><span class="value">${r.plan||'—'}${r.region?' · '+r.region:''}</span></div>
  <div class="row"><span class="label">🚀 آخر نشر</span><span class="value" style="color:${depColor}">${dep.status||'—'}</span></div>
  ${dep.finished_at?`<div class="row"><span class="label">🕐 وقت النشر</span><span class="value">${dep.finished_at}</span></div>`:''}
  ${bw}${probe}
  <div class="row" style="opacity:.7"><span class="label" style="font-size:.75rem">ℹ️ الساعات المتبقية</span><span class="value" style="font-size:.72rem">تُراجع من لوحة Render (غير متاحة عبر API)</span></div>
  </div>`
}
function renderHealth(d,neon,render){const wh=d.webhook||{},db=d.database||{},srv=d.server||{},ich=d.ichancy||{},cash=d.cashier||{},st=d.stats||{};document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">🩺 حالة النظام</div><div class="row"><span class="label">السيرفر</span><span>${okBadge(srv.ok)}</span></div><div class="row"><span class="label">⏱️ مدة التشغيل</span><span class="value">${srv.uptime_text||'—'}</span></div><div class="row"><span class="label">🕐 وقت السيرفر</span><span class="value">${srv.server_time||'—'}</span></div></div>
<div class="card"><div class="card-title">🗄️ قاعدة البيانات</div><div class="row"><span class="label">الحالة</span><span>${okBadge(db.ok)}</span></div><div class="row"><span class="label">زمن الاستجابة</span><span class="value">${db.latency_ms||'—'} ms</span></div></div>
${neonCard(neon)}
${renderRenderCard(render)}
<div class="card"><div class="card-title">🌐 Telegram Webhook</div><div class="row"><span class="label">الحالة</span><span>${okBadge(wh.ok)}</span></div><div class="row"><span class="label">Pending</span><span class="value">${wh.pending_update_count??'—'}</span></div></div>
<div class="card"><div class="card-title">🎮 iChancy</div><div class="row"><span class="label">الجلسة</span><span>${okBadge(ich.ok)}</span></div><div class="row"><span class="label">عمر الكوكيز</span><span class="value">${ich.cookie_age_text||'—'}</span></div></div>
<div class="card"><div class="card-title">📊 أرقام سريعة</div><div class="row"><span class="label">👥 المستخدمون</span><span class="value">${fmt(st.total_users)}</span></div><div class="row"><span class="label">⏳ الطلبات المعلقة</span><span class="value">${fmt(st.pending_requests)}</span></div><div class="row"><span class="label">🔄 معاملات اليوم</span><span class="value">${fmt(st.today_tx)}</span></div></div>
<button class="btn outline" onclick="showTab('more')">🔙 رجوع</button>`}

function bcPayload(action){return{action,message_type:val('bc_type'),audience:val('bc_audience'),title:val('bc_title'),message:val('bc_message')}}
async function countBroadcastTargets(){try{const r=await apiPost(BROADCAST_API,bcPayload('count'));setNotice(`👥 عدد المستلمين: ${fmt(r.count)}`)}catch(e){setNotice('❌ '+e.message,'error')}}
async function sendBroadcastTest(){try{const r=await apiPost(BROADCAST_API,bcPayload('test'));setNotice(`✅ تجربة: ${r.sent} / فشل ${r.failed}`)}catch(e){setNotice('❌ '+e.message,'error')}}
async function sendBroadcastAll(){if(!val('bc_message').trim()){setNotice('❌ نص الرسالة فارغ','error');return}tg.showConfirm('تأكيد الإرسال؟',async(ok)=>{if(!ok)return;try{setNotice('🚀 جاري الإرسال...');const r=await apiPost(BROADCAST_API,bcPayload('send'));setNotice(`✅ وصل ${r.sent} / فشل ${r.failed}`);loadRecentBroadcasts();}catch(e){setNotice('❌ '+e.message,'error')}})}
async function loadRecentBroadcasts(){try{const d=await apiGet(BROADCASTS_API);const items=d.items||[];document.getElementById('broadcastRecent').innerHTML=`<div class="card"><div class="card-title">📜 آخر الإرسالات</div>${items.map(x=>`<div class="pending-item"><b>#${x.id} ${x.title||''}</b><br>✅ ${x.sent_count||0} / ❌ ${x.failed_count||0} / 🎯 ${x.total_targets||0}<br><span class="label">${x.created_at||''}</span></div>`).join('')||'<div class="empty">لا يوجد سجل</div>'}</div>`;}catch(e){}}

async function supportApi(payload){return apiPost(SUPPORT_API,payload);}
function loadSupport(status='open'){currentTab='support';setNavActive('support');document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل تذاكر الدعم...</div>';supportApi({action:'list',status,limit:50}).then(d=>renderSupportList(d,status)).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div>`})}

function renderSupportList(d,status){const tickets=d.tickets||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">📩 مركز الدعم</div><div class="btn-row-3"><button class="btn ${status==='open'?'green':'outline'}" onclick="loadSupport('open')">مفتوحة</button><button class="btn ${status==='closed'?'green':'outline'}" onclick="loadSupport('closed')">مغلقة</button><button class="btn ${status==='all'?'green':'outline'}" onclick="loadSupport('all')">الكل</button></div></div>
<div class="card"><div class="card-title">🎫 التذاكر (${tickets.length})</div>${tickets.map(t=>`<div class="pending-item"><b>#${t.id} ${t.telegram_username||t.user_telegram_id}</b> • ${t.status==='open'?'🟢 مفتوحة':'🔒 مغلقة'}<br>🎮 ${t.ichancy_username||'—'} | 💎 ${fmt(t.bot_balance)} SYP<br>${t.last_message||''}<br><span class="label">${t.last_message_at||t.created_at||''}</span><button class="btn outline" onclick="loadSupportTicket(${t.id})">👁️ فتح</button></div>`).join('')||'<div class="empty">لا توجد تذاكر</div>'}</div>`;}

function loadSupportTicket(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل التذكرة...</div>';supportApi({action:'detail',ticket_id:id}).then(renderSupportTicket).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadSupport()">🔙 رجوع</button>`})}

function renderSupportTicket(d){const t=d.ticket||{},u=d.user||{},msgs=d.messages||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">🎫 تذكرة #${t.id}</div><div class="row"><span class="label">المستخدم</span><span class="value">${u.telegram_username||t.user_telegram_id}</span></div><div class="row"><span class="label">iChancy</span><span class="value">${u.ichancy_username||'—'}</span></div><div class="row"><span class="label">الحالة</span><span>${t.status==='open'?'🟢 مفتوحة':'🔒 مغلقة'}</span></div><button class="btn outline" onclick="loadUserDetail('${t.user_telegram_id}')">👥 ملف المستخدم</button></div>
<div class="card"><div class="card-title">💬 المحادثة</div>${msgs.map(m=>`<div class="pending-item" style="border-right-color:${m.sender_type==='admin'?'var(--green)':'var(--blue)'}"><b>${m.sender_type==='admin'?'👑 الإدارة':'👤 المستخدم'}</b><br>${m.message_text||'['+(m.content_type||'message')+']'}<br><span class="label">${m.created_at||''}</span></div>`).join('')||'<div class="empty">لا توجد رسائل</div>'}</div>
<div class="card"><div class="card-title">↩️ رد الإدارة</div><textarea id="support_reply_text" style="direction:rtl;text-align:right" placeholder="اكتب الرد..."></textarea><button class="btn green" onclick="sendSupportReply(${t.id})">📩 إرسال الرد</button><button class="btn outline" onclick="closeSupportTicket(${t.id})">🔒 إغلاق</button><button class="btn outline" onclick="loadSupport()">🔙 رجوع</button></div>`}

function sendSupportReply(id){const msg=val('support_reply_text');if(!msg.trim()){setNotice('❌ الرد فارغ','error');return}supportApi({action:'reply',ticket_id:id,message:msg}).then(()=>{setNotice('✅ تم إرسال الرد');loadSupportTicket(id)}).catch(e=>setNotice('❌ '+e.message,'error'))}
function closeSupportTicket(id){tg.showConfirm('إغلاق التذكرة؟',ok=>{if(!ok)return;supportApi({action:'close',ticket_id:id}).then(()=>{setNotice('✅ تم الإغلاق');loadSupport('open')}).catch(e=>setNotice('❌ '+e.message,'error'))})}

function renderReqItem(t){return `<div class="pending-item"><b>#${t.id} ${typeLabel(t.type)}</b> • ${statusLabel(t.status)}<br>👤 ${t.telegram_username||'—'} <span class="label">${t.user_telegram_id}</span><br>💰 <b>${fmt(t.amount)} SYP</b> | 💳 ${t.payment_method||'—'}<br><span class="label">${t.created_at||''}</span><button class="btn outline" onclick="loadRequestDetail(${t.id})">👁️ التفاصيل</button></div>`}

function searchRequests(){const q=val('req_search_q').trim();if(!q){setNotice('أدخل قيمة','error');return}document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ البحث...</div>';requestsApi({action:'search',query:q}).then(d=>{document.getElementById('content').innerHTML=`<div class="card"><div class="card-title">🔎 النتائج</div><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button>${(d.items||[]).map(renderReqItem).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`}).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button>`})}

function loadRequestDetail(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل التفاصيل...</div>';requestsApi({action:'detail',tx_id:id}).then(renderRequestDetail).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button>`})}

function renderRequestDetail(d){const t=d.transaction||{},u=d.user||{},h=d.history||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">📌 الطلب #${t.id}</div><div class="row"><span class="label">النوع</span><span class="value">${typeLabel(t.type)}</span></div><div class="row"><span class="label">الحالة</span><span>${statusLabel(t.status)}</span></div><div class="row"><span class="label">المبلغ</span><span class="value gold">${fmt(t.amount)} SYP</span></div><div class="row"><span class="label">الوسيلة</span><span class="value">${t.payment_method||'—'}</span></div><div class="row"><span class="label">التاريخ</span><span class="value">${t.created_at||'—'}</span></div><div class="hint">${t.transfer_number||''}</div></div>

<div class="card"><div class="card-title">🕒 آخر معاملات</div>${h.map(x=>`<div class="pending-item"><b>#${x.id} ${x.type}</b> • ${x.status}<br>💰 ${fmt(x.amount)} | ${x.created_at}</div>`).join('')||'<div class="empty">لا يوجد سجل</div>'}</div>`}

function promptRequestMessage(tid,id){const msg=prompt('رسالة للمستخدم بخصوص الطلب #'+id);if(!msg)return;requestsApi({action:'message_user',telegram_id:tid,message:msg}).then(()=>setNotice('✅ تم إرسال الرسالة')).catch(e=>setNotice('❌ '+e.message,'error'))}
function deleteTransaction(id,refund){const msg=refund?'⚠️ حذف الطلب نهائياً مع إعادة الرصيد للمستخدم؟':'⚠️ حذف الطلب نهائياً (بدون إعادة رصيد)؟';tg.showConfirm(msg,async ok=>{if(!ok)return;try{const r=await requestsApi({action:'delete_transaction',tx_id:id,refund});if(r.refunded>0){setNotice('✅ تم حذف الطلب وإعادة '+fmt(r.refunded)+' SYP للمستخدم')}else{setNotice('🗑️ تم حذف الطلب')}loadRequests();}catch(e){setNotice('❌ '+e.message,'error')}})}

function loadUsers(){currentTab='users';setNavActive('users');document.getElementById('content').innerHTML=`

async function bonusesApi(payload){return apiPost(BONUSES_API,payload);}
async function loadBonuses(){currentTab='bonuses';setNavActive('more');document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل البونصات...</div>';try{const d=await bonusesApi({action:'summary'});renderBonuses(d);}catch(e){document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div>`}}

function renderBonuses(d){const bs=d.bonus_summary||{},rs=d.referral_summary||{},aff=d.affiliate_summary||{},st=d.settings||{},rules=d.bonus_rules||[],top=d.top_referrers||[],recent=d.recent_commissions||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">🎁 البونصات والإحالات</div><div class="btn-row"><button class="btn ${st.referrals_enabled!==false?'danger':'green'}" onclick="toggleReferrals(${st.referrals_enabled!==false?'false':'true'})">${st.referrals_enabled!==false?'⛔ إيقاف الإحالات':'✅ تفعيل الإحالات'}</button><button class="btn outline" onclick="loadBonuses()">🔄 تحديث</button></div></div>
<div class="card"><div class="card-title">📊 ملخص</div><div class="row"><span class="label">🎁 عروض البونص</span><span class="value">${fmt(bs.total_rules)} / النشطة ${fmt(bs.active_rules)}</span></div><div class="row"><span class="label">👥 الإحالات</span><span class="value">${fmt(rs.total_referrals)} مسجلة | ${fmt(rs.active_referrals)} نشطة</span></div><div class="row"><span class="label">💵 أرباح إحالات قابلة للسحب</span><span class="value gold">${fmt(aff.total_paid||0)} SYP</span></div></div>
<div class="card"><div class="card-title">🤝 عمولات الإحالات الأسبوعية</div><div class="warn-box">تُحسب من خسارة المحالين في اللعبة خلال آخر 7 أيام، وتضاف لرصيد أرباح إحالات قابل للسحب.</div><div class="row"><span class="label">إحالات نشطة غير معالجة هذا الأسبوع</span><span class="value">${fmt(aff.pending_active_referrals||0)}</span></div><button class="btn gold" onclick="processAffiliateCommissions()">🤝 صرف عمولات الإحالات الأسبوعية</button>${(aff.recent||[]).length?`<div style="margin-top:10px">${(aff.recent||[]).map(x=>`<div class="pending-item"><b>${x.referrer_username||x.referrer_telegram_id}</b> ← ${x.referred_username||x.referred_telegram_id}<br>🔥 خسارة: ${fmt(x.net_loss)} | 📈 ${x.commission_percent}% | 💵 ${fmt(x.commission_amount)} SYP<br><span class="label">الأسبوع: ${x.week_start}</span></div>`).join('')}</div>`:''}</div>
<div class="card"><div class="card-title">➕ إنشاء عرض بونص</div><div class="field"><label>اسم العرض</label><input id="bonus_title" placeholder="مثال: بونص العيد"></div><div class="field"><label>النسبة %</label><input id="bonus_percent" inputmode="decimal" placeholder="10"></div><div class="field"><label>طريقة الدفع</label><select id="bonus_method"><option value="all">كل الطرق</option><option value="syriatel">سيرياتيل</option><option value="mtn">MTN</option><option value="sham_syp">شام كاش SYP</option><option value="sham_usd">شام كاش USD</option><option value="usdt_trc">USDT TRC20</option><option value="usdt_bep">USDT BEP20</option></select></div><div class="field"><label>الحد الأدنى SYP</label><input id="bonus_min" inputmode="numeric" value="0"></div><div class="field"><label>الحد الأعلى SYP</label><input id="bonus_max" inputmode="numeric" value="0"></div><button class="btn green" onclick="createBonusRule()">✅ إنشاء</button></div>
<div class="card"><div class="card-title">📋 العروض الحالية</div>${rules.map(r=>{const methodMap={'all':'كل الطرق','syriatel':'🟢 سيريتل كاش','mtn':'🟡 MTN كاش','sham_syp':'📱 شام كاش SYP','sham_usd':'💵 شام كاش USD','usdt_trc':'🪙 USDT TRC20','usdt_bep':'🪙 USDT BEP20'};const methodName=methodMap[r.payment_method]||r.payment_method;return `<div class="pending-item" style="border-right-color:${r.is_active?'var(--green)':'var(--red)'}"><b>#${r.id} ${r.title}</b> ${r.is_active?'<span class="pill green">فعّال</span>':'<span class="pill">متوقف</span>'}<br>📈 ${r.percent}% | 💳 ${methodName}<br>💰 حد أدنى: ${fmt(r.min_amount_syp)} | 🛡️ حد أعلى: ${fmt(r.max_bonus_syp)}<div class="btn-row-3">${r.is_active?`<button class="btn danger" onclick="disableBonusRule(${r.id})">🛑 إيقاف</button>`:`<button class="btn green" onclick="enableBonusRule(${r.id})">✅ تفعيل</button>`}<button class="btn outline" onclick="editBonusRule(${r.id},'${String(r.title).replace(/'/g,"\\'")}',${r.percent},'${r.payment_method}',${r.min_amount_syp},${r.max_bonus_syp})">✏️ تعديل</button><button class="btn danger" onclick="deleteBonusRule(${r.id})">🗑️ حذف</button></div></div>`}).join('')||'<div class="empty">لا توجد عروض</div>'}</div>
<div id="bonusEditBox"></div>
<div class="card"><div class="card-title">🏆 أفضل المُحيلين</div>${top.map(r=>`<div class="pending-item"><b>${r.telegram_username||r.referrer_telegram_id}</b><br>👥 ${fmt(r.total_referrals)} | ✅ ${fmt(r.active_referrals)} | 📈 ${r.current_percent}%<br>💰 ${fmt(r.total_earnings)} SYP</div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div>
<button class="btn outline" onclick="showTab('more')">🔙 رجوع</button>`;}

async function createBonusRule(){try{await bonusesApi({action:'create_bonus',title:val('bonus_title'),percent:val('bonus_percent'),payment_method:val('bonus_method'),min_amount_syp:val('bonus_min'),max_bonus_syp:val('bonus_max')});setNotice('✅ تم إنشاء العرض');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
async function enableBonusRule(id){try{await bonusesApi({action:'enable_bonus',rule_id:id});setNotice('✅ تم تفعيل العرض');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
async function deleteBonusRule(id){tg.showConfirm('حذف العرض نهائياً؟',async ok=>{if(!ok)return;try{await bonusesApi({action:'delete_bonus',rule_id:id});setNotice('🗑️ تم حذف العرض');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}})}
function editBonusRule(id,title,percent,method,min,max){const methodMap={'all':'كل الطرق','syriatel':'سيريتل','mtn':'MTN','sham_syp':'شام SYP','sham_usd':'شام USD','usdt_trc':'USDT TRC20','usdt_bep':'USDT BEP20'};const opts=Object.entries(methodMap).map(([k,v])=>`<option value="${k}" ${k===method?'selected':''}>${v}</option>`).join('');document.getElementById('bonusEditBox').innerHTML=`<div class="card" style="border:2px solid var(--gold)"><div class="card-title">✏️ تعديل العرض #${id}</div><div class="field"><label>اسم العرض</label><input id="edit_title" value="${title}"></div><div class="field"><label>النسبة %</label><input id="edit_percent" inputmode="decimal" value="${percent}"></div><div class="field"><label>طريقة الدفع</label><select id="edit_method">${opts}</select></div><div class="field"><label>الحد الأدنى SYP</label><input id="edit_min" inputmode="numeric" value="${min}"></div><div class="field"><label>الحد الأعلى SYP</label><input id="edit_max" inputmode="numeric" value="${max}"></div><div class="btn-row"><button class="btn green" onclick="saveBonusEdit(${id})">💾 حفظ التعديل</button><button class="btn outline" onclick="document.getElementById('bonusEditBox').innerHTML=''">❌ إلغاء</button></div></div>`;document.getElementById('bonusEditBox').scrollIntoView({behavior:'smooth'})}
async function saveBonusEdit(id){try{await bonusesApi({action:'update_bonus',rule_id:id,title:val('edit_title'),percent:val('edit_percent'),payment_method:document.getElementById('edit_method').value,min_amount_syp:val('edit_min'),max_bonus_syp:val('edit_max')});setNotice('✅ تم حفظ التعديل');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
async function disableBonusRule(id){try{await bonusesApi({action:'disable_bonus',rule_id:id});setNotice('✅ تم الإيقاف');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
function toggleReferrals(enabled){tg.showConfirm((enabled?'تفعيل':'إيقاف')+' الإحالات؟',async ok=>{if(!ok)return;try{await bonusesApi({action:'toggle_referrals',enabled});setNotice('✅ تم التحديث');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}})}
function processAffiliateCommissions(){tg.showConfirm('صرف عمولات الإحالات الأسبوعية الآن؟',async ok=>{if(!ok)return;try{const r=await bonusesApi({action:'process_affiliate_commissions'});setNotice(`✅ تم الفحص: ${fmt(r.checked||0)} | المستفيدون: ${fmt(r.paid_count||0)} | المدفوع: ${fmt(r.total_paid||0)} SYP`);loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}})}

        <div class="stat-box"><div class="stat-label">مدفوعات الأسبوع</div><div class="stat-value green">${fmt(cbs.week_paid||0)}</div></div>
        <div class="stat-box"><div class="stat-label">مستفيدين</div><div class="stat-value blue">${fmt(cbs.week_count||0)}</div></div>
        <div class="stat-box"><div class="stat-label">إجمالي مدفوع</div><div class="stat-value gold">${fmt(cbs.total_paid||0)}</div></div>
        <div class="stat-box"><div class="stat-label">خسائر الأسبوع</div><div class="stat-value red">${fmt(cbs.week_losses||0)}</div></div>
      </div>
      <div class="warn-box" style="margin-top:10px">% من خسارة المستخدمين في اللعبة يرجع لهم كرصيد مكافآت أسبوعياً.</div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn ${cbEn?'danger':'green'}" onclick="toggleCashback(${cbEn?'false':'true'})">${cbEn?'⛔ إيقاف':'✅ تفعيل'}</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">⚙️ إعدادات الكاش باك</div>
      <div class="field"><label>نسبة الاسترجاع %</label><input id="cb_pct" inputmode="decimal" value="${cbPct}"></div>
      <div class="field"><label>الحد الأدنى للخسارة (ل.س)</label><input id="cb_min" inputmode="numeric" value="${cbMin}"><div class="hint">المستخدم الذي تخسر خسارته أقل من هذا المبلغ لا يحصل على كاش باك</div></div>
      <button class="btn green" onclick="saveCashback()">💾 حفظ إعدادات الكاش باك</button>
    </div>

    <!-- لوحة الصدارة -->
    <div class="card">
      <div class="card-title">📊 لوحة الصدارة <span class="pill ${s.leaderboard_enabled!==false?'green':''}">${s.leaderboard_enabled!==false?'مفعّل':'متوقف'}</span></div>
      <div class="field"><label>الفترة</label><select id="lb_type"><option value="all_time" ${lbType==='all_time'?'selected':''}>كل الوقت</option><option value="weekly" ${lbType==='weekly'?'selected':''}>أسبوعي</option><option value="monthly" ${lbType==='monthly'?'selected':''}>شهري</option></select></div>
      <div class="btn-row">
        <button class="btn ${s.leaderboard_enabled!==false?'danger':'green'}" onclick="toggleFeature('leaderboard_enabled',${s.leaderboard_enabled!==false?'false':'true'})">${s.leaderboard_enabled!==false?'⛔ إيقاف الصدارة':'✅ تفعيل الصدارة'}</button>
        <button class="btn outline" onclick="saveLbType()">💾 حفظ الفترة</button>
      </div>
    </div>

    <button class="btn outline" onclick="showTab('more')">🔙 رجوع</button>
  `;
}

async function toggleFeature(key,val){
  const payload={action:'update_features'};payload[key]=val;
  try{await apiPost(FEATURES_API,payload);setNotice('✅ تم التحديث');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function saveCheckinSettings(){
  const cycle=parseInt(document.getElementById('checkin_cycle_days').value)||30;
  const minDep=parseInt(document.getElementById('checkin_min_deposit').value)||50000;
  const reward=parseInt(document.getElementById('checkin_completion_reward').value)||20000;
  try{await apiPost(FEATURES_API,{action:'update_features',checkin_cycle_days:cycle,checkin_min_deposit:minDep,checkin_completion_reward:reward});setNotice('✅ تم حفظ إعدادات الحضور');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function saveLbType(){
  const t=document.getElementById('lb_type').value;
  try{await apiPost(FEATURES_API,{action:'update_features',leaderboard_type:t});setNotice('✅ تم حفظ الفترة');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function toggleWheel(en){
  try{await apiPost(FEATURES_API,{action:'update_wheel',wheel_enabled:en});setNotice('✅ تم التحديث');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function toggleVIP(en){
  try{await apiPost(FEATURES_API,{action:'update_vip',vip_enabled:en});setNotice('✅ تم التحديث');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function saveVIP(){
  const tiers=[];
  for(let i=0;i<4;i++){
    const thresh=parseInt(document.getElementById('vip_'+i+'_thresh').value)||0;
    const pct=parseFloat(document.getElementById('vip_'+i+'_pct').value)||0;
    const reward=parseInt(document.getElementById('vip_'+i+'_reward').value)||0;
    tiers.push([thresh,pct,reward]);
  }
  try{await apiPost(FEATURES_API,{action:'update_vip',tiers});setNotice('✅ تم حفظ طبقات VIP');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function toggleCashback(en){try{await apiPost(FEATURES_API,{action:"update_cashback",cashback_enabled:en});setNotice("✅ تم التحديث");loadFeatures();}catch(e){setNotice("❌ "+e.message,"error")}}
async function saveCashback(){const pct=parseFloat(document.getElementById("cb_pct").value)||0;const minLoss=parseInt(document.getElementById("cb_min").value)||0;try{await apiPost(FEATURES_API,{action:"update_cashback",cashback_pct:pct,cashback_min_loss:minLoss});setNotice("✅ تم حفظ إعدادات الكاش باك");loadFeatures();}catch(e){setNotice("❌ "+e.message,"error")}}
async function saveWheel(){
  const fixed=[[0,1,'PINGO'],[0,1,'0%'],[1,1,'+1%'],[2,1,'+2%'],[0,1,'0%'],[3,1,'+3%'],[4,1,'+4%'],[0,1,'0%']];
  const segments=[];
  for(let i=0;i<8;i++){
    const prob=parseFloat(document.getElementById('wseg_'+i+'_prob').value);
    segments.push([fixed[i][0], Number.isFinite(prob)?prob:0, fixed[i][2]]);
  }
  const total=segments.reduce((a,s)=>a+Math.max(0,s[1]),0);
  if(total<=0){setNotice('⚠️ مجموع الاحتمالات يجب أن يكون أكبر من صفر','error');return}
  try{await apiPost(FEATURES_API,{action:'update_wheel',segments});setNotice('✅ تم حفظ احتمالات العجلة');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function createFlash(){
  const percent=parseFloat(val('flash_percent'));const duration=parseInt(val('flash_duration'));const method=document.getElementById('flash_method').value;
  if(!percent||percent<=0){setNotice('أدخل نسبة صحيحة','error');return}
  try{await apiPost(FLASH_API,{action:'create',percent,duration_minutes:duration,payment_method:method});setNotice('⚡ تم إطلاق الفلاش!');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function stopFlash(id){
  tg.showConfirm('إيقاف الفلاش الآن؟',async ok=>{if(!ok)return;try{await apiPost(FLASH_API,{action:'stop'});setNotice('🛑 تم الإيقاف');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}})
}

// ===== بدء التشغيل =====
loadDashboard();
</script>
</body>
</html>
