<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" direction="rtl">
  <defs>
    <radialGradient id="pageBg" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#1d1733"/>
      <stop offset="0.45" stop-color="#080b14"/>
      <stop offset="1" stop-color="#020307"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5b8"/>
      <stop offset="0.45" stop-color="#ffd45f"/>
      <stop offset="1" stop-color="#9b6500"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd45f" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd45f" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#ffd45f" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .font{font-family:Tahoma,Arial,sans-serif}
      .title{font-family:Tahoma,Arial,sans-serif;font-weight:900;fill:#fff;font-size:42px;text-anchor:middle}
      .sub{font-family:Tahoma,Arial,sans-serif;fill:#aeb7d2;font-size:20px;text-anchor:middle}
      .label{font-family:Tahoma,Arial,sans-serif;fill:#9ba6c4;font-size:22px;font-weight:700}
      .value{font-family:Tahoma,Arial,sans-serif;fill:#fff;font-size:34px;font-weight:900}
      .goldText{font-family:Tahoma,Arial,sans-serif;fill:#ffd45f;font-weight:900}
      .small{font-family:Tahoma,Arial,sans-serif;fill:#c7cfe6;font-size:18px}
      .tiny{font-family:Tahoma,Arial,sans-serif;fill:#8f99b8;font-size:15px}
      .card{fill:url(#glass);stroke:rgba(255,255,255,0.10);stroke-width:1.5}
      .cardGold{fill:rgba(255,212,95,0.09);stroke:#ffd45f;stroke-opacity:0.42;stroke-width:1.6}
      .pill{fill:rgba(255,212,95,0.14);stroke:#ffd45f;stroke-opacity:0.5}
      .btnText{font-family:Tahoma,Arial,sans-serif;font-weight:900;font-size:24px;fill:#0a0b10;text-anchor:middle;dominant-baseline:middle}
      .navText{font-family:Tahoma,Arial,sans-serif;font-size:15px;fill:#b5bed8;text-anchor:middle;font-weight:700}
      .dayDone{fill:rgba(0,214,143,0.25);stroke:#00d68f;stroke-width:1}
      .dayEmpty{fill:rgba(255,255,255,0.055);stroke:rgba(255,255,255,0.12);stroke-width:1}
    </style>
  </defs>

  <rect width="1200" height="1700" fill="url(#pageBg)"/>

  <!-- background lighting / moving-light impression -->
  <circle cx="210" cy="170" r="180" fill="#7c3cff" opacity="0.24" filter="url(#softGlow)"/>
  <circle cx="1010" cy="290" r="210" fill="#ffd45f" opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="640" cy="1370" r="330" fill="#1b88ff" opacity="0.08" filter="url(#softGlow)"/>
  <path d="M-80 360 C260 210 520 300 1280 30" stroke="#ffd45f" stroke-width="18" opacity="0.10" fill="none" filter="url(#softGlow)"/>
  <path d="M-40 980 C300 810 610 900 1230 690" stroke="#7c3cff" stroke-width="20" opacity="0.13" fill="none" filter="url(#softGlow)"/>

  <!-- phone frame -->
  <rect x="370" y="70" width="460" height="1560" rx="54" fill="#05070d" stroke="#2b3144" stroke-width="4" filter="url(#shadow)"/>
  <rect x="392" y="96" width="416" height="1508" rx="42" fill="#080b14"/>
  <rect x="522" y="104" width="156" height="26" rx="13" fill="#000" opacity="0.9"/>

  <!-- app background clipped impression -->
  <clipPath id="screen"><rect x="392" y="96" width="416" height="1508" rx="42"/></clipPath>
  <g clip-path="url(#screen)">
    <rect x="392" y="96" width="416" height="1508" fill="#080b14"/>
    <circle cx="432" cy="170" r="100" fill="#7c3cff" opacity="0.23" filter="url(#softGlow)"/>
    <circle cx="760" cy="180" r="130" fill="#ffd45f" opacity="0.12" filter="url(#softGlow)"/>
    <path d="M390 245 C520 185 655 230 810 155" stroke="#ffd45f" stroke-width="8" opacity="0.12" fill="none"/>

    <!-- header -->
    <text x="600" y="166" class="title" font-size="28">👑 Caesar Club</text>
    <text x="600" y="196" class="sub" font-size="14">لوحة المكافآت واللعب الخاصة بك</text>
    <rect x="427" y="222" width="346" height="92" rx="26" class="cardGold"/>
    <text x="600" y="255" class="goldText" font-size="16" text-anchor="middle">أهلاً ياسمين — طبقة فارس 🥈</text>
    <text x="600" y="288" class="small" font-size="14" text-anchor="middle">باقي 380,000 ل.س للترقية إلى نبيل 🥇</text>
    <rect x="454" y="296" width="292" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="454" y="296" width="116" height="8" rx="4" fill="url(#gold)"/>

    <!-- balance cards -->
    <rect x="424" y="338" width="164" height="112" rx="22" class="card"/>
    <text x="506" y="370" class="label" font-size="13" text-anchor="middle">💎 رصيد البوت</text>
    <text x="506" y="410" class="value" font-size="24" text-anchor="middle">120,000</text>
    <text x="506" y="432" class="tiny" font-size="11" text-anchor="middle">قابل للسحب</text>

    <rect x="612" y="338" width="164" height="112" rx="22" class="card"/>
    <text x="694" y="370" class="label" font-size="13" text-anchor="middle">🎮 رصيد اللعبة</text>
    <text x="694" y="410" class="value" font-size="24" text-anchor="middle">85,500</text>
    <text x="694" y="432" class="tiny" font-size="11" text-anchor="middle">NSP</text>

    <rect x="424" y="468" width="164" height="112" rx="22" class="cardGold"/>
    <text x="506" y="500" class="label" font-size="13" text-anchor="middle">🎁 بونص اللعب</text>
    <text x="506" y="540" class="value" font-size="24" text-anchor="middle">12,000</text>
    <text x="506" y="562" class="tiny" font-size="11" text-anchor="middle">يُرفق عند الشحن</text>

    <rect x="612" y="468" width="164" height="112" rx="22" class="card"/>
    <text x="694" y="500" class="label" font-size="13" text-anchor="middle">🤝 أرباح الإحالات</text>
    <text x="694" y="540" class="value" font-size="24" text-anchor="middle" fill="#00d68f">7,400</text>
    <text x="694" y="562" class="tiny" font-size="11" text-anchor="middle">قابل للسحب</text>

    <!-- action buttons -->
    <rect x="424" y="610" width="352" height="58" rx="20" fill="url(#gold)" filter="url(#goldGlow)"/>
    <text x="600" y="640" class="btnText">⚡ شحن حساب اللعبة</text>
    <rect x="424" y="684" width="164" height="54" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="506" y="713" class="small" font-size="13" text-anchor="middle">📥 إيداع</text>
    <rect x="612" y="684" width="164" height="54" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="694" y="713" class="small" font-size="13" text-anchor="middle">📤 سحب</text>

    <!-- rewards center -->
    <rect x="424" y="766" width="352" height="170" rx="26" class="card"/>
    <text x="744" y="802" class="goldText" font-size="16" text-anchor="end">🎁 مركز المكافآت</text>
    <rect x="448" y="823" width="304" height="28" rx="14" fill="rgba(255,212,95,0.10)"/>
    <text x="736" y="842" class="small" font-size="12" text-anchor="end">💸 كاش باك مستحق: 3,000 ل.س</text>
    <rect x="448" y="860" width="304" height="28" rx="14" fill="rgba(0,214,143,0.10)"/>
    <text x="736" y="879" class="small" font-size="12" text-anchor="end">📅 حضور مستحق: 20,000 ل.س</text>
    <rect x="448" y="897" width="304" height="28" rx="14" fill="rgba(255,255,255,0.055)"/>
    <text x="736" y="916" class="small" font-size="12" text-anchor="end">🔥 بونص نشط داخل اللعبة: 4,200 ل.س</text>

    <!-- checkin visual -->
    <rect x="424" y="962" width="352" height="182" rx="26" class="card"/>
    <text x="744" y="998" class="goldText" font-size="16" text-anchor="end">📅 الحضور اليومي</text>
    <text x="448" y="998" class="tiny" font-size="11" text-anchor="start">18 / 30 يوم</text>
    <rect x="448" y="1018" width="304" height="10" rx="5" fill="rgba(255,255,255,0.07)"/>
    <rect x="448" y="1018" width="182" height="10" rx="5" fill="linear-gradient(90deg,#00d68f,#ffd45f)"/>
    <!-- days grid -->
    <g transform="translate(448,1045)">
      <g>
        <circle cx="10" cy="10" r="8" class="dayDone"/><circle cx="31" cy="10" r="8" class="dayDone"/><circle cx="52" cy="10" r="8" class="dayDone"/><circle cx="73" cy="10" r="8" class="dayDone"/><circle cx="94" cy="10" r="8" class="dayDone"/>
        <circle cx="115" cy="10" r="8" class="dayDone"/><circle cx="136" cy="10" r="8" class="dayDone"/><circle cx="157" cy="10" r="8" class="dayDone"/><circle cx="178" cy="10" r="8" class="dayDone"/><circle cx="199" cy="10" r="8" class="dayDone"/>
        <circle cx="220" cy="10" r="8" class="dayDone"/><circle cx="241" cy="10" r="8" class="dayDone"/><circle cx="262" cy="10" r="8" class="dayDone"/><circle cx="283" cy="10" r="8" class="dayDone"/><circle cx="304" cy="10" r="8" class="dayDone"/>
        <circle cx="10" cy="34" r="8" class="dayDone"/><circle cx="31" cy="34" r="8" class="dayDone"/><circle cx="52" cy="34" r="8" class="dayDone"/>
        <circle cx="73" cy="34" r="8" class="dayEmpty"/><circle cx="94" cy="34" r="8" class="dayEmpty"/><circle cx="115" cy="34" r="8" class="dayEmpty"/><circle cx="136" cy="34" r="8" class="dayEmpty"/><circle cx="157" cy="34" r="8" class="dayEmpty"/><circle cx="178" cy="34" r="8" class="dayEmpty"/><circle cx="199" cy="34" r="8" class="dayEmpty"/><circle cx="220" cy="34" r="8" class="dayEmpty"/><circle cx="241" cy="34" r="8" class="dayEmpty"/><circle cx="262" cy="34" r="8" class="dayEmpty"/><circle cx="283" cy="34" r="8" class="dayEmpty"/><circle cx="304" cy="34" r="8" class="dayEmpty"/>
      </g>
    </g>
    <text x="600" y="1120" class="tiny" font-size="11" text-anchor="middle">المكافأة عند الإكمال: 20,000 ل.س — شرط الإيداع 50,000</text>

    <!-- pingo wheel small -->
    <rect x="424" y="1170" width="352" height="210" rx="26" class="card"/>
    <text x="744" y="1207" class="goldText" font-size="16" text-anchor="end">🎰 عجلة PINGO</text>
    <g transform="translate(600,1285) scale(.52)">
      <circle r="110" fill="#050505" stroke="url(#gold)" stroke-width="8"/>
      <path d="M0,0 L0,-95 A95,95 0 0,1 67,-67 Z" fill="url(#gold)" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L67,-67 A95,95 0 0,1 95,0 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L95,0 A95,95 0 0,1 67,67 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L67,67 A95,95 0 0,1 0,95 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L0,95 A95,95 0 0,1 -67,67 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L-67,67 A95,95 0 0,1 -95,0 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L-95,0 A95,95 0 0,1 -67,-67 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <path d="M0,0 L-67,-67 A95,95 0 0,1 0,-95 Z" fill="#111" stroke="#ffd45f" stroke-width="2"/>
      <circle r="36" fill="url(#gold)"/>
      <text y="6" class="centerText" font-size="24">👑</text>
    </g>
    <polygon points="600,1208 588,1231 612,1231" fill="url(#gold)" filter="url(#goldGlow)"/>
    <text x="600" y="1370" class="tiny" font-size="11" text-anchor="middle">إيداعك الأخير مؤهل لدوران العجلة</text>

    <!-- bottom nav -->
    <rect x="392" y="1518" width="416" height="86" fill="#06080f" stroke="rgba(255,255,255,.08)"/>
    <g transform="translate(444,1545)"><text class="navText">🏠</text><text y="30" class="navText">الرئيسية</text></g>
    <g transform="translate(548,1545)"><text class="navText">🎁</text><text y="30" class="navText">المكافآت</text></g>
    <g transform="translate(652,1545)"><text class="navText">🎮</text><text y="30" class="navText">اللعبة</text></g>
    <g transform="translate(756,1545)"><text class="navText">🤝</text><text y="30" class="navText">الشركاء</text></g>
  </g>

  <!-- side annotations -->
  <text x="600" y="1660" class="sub">تصور بصري مقترح للصفحة الرئيسية الجديدة — مع الحفاظ على الإضاءة المتحركة والهوية السوداء/الذهبية</text>
</svg>