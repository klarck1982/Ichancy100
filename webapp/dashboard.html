<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👑 لوحة تحكم القيصر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
  :root{
    --bg:#070a12;
    --bg2:#0d111c;
    --text:#f5f5f5;
    --hint:#8b95a7;
    --link:#5b9bf5;
    --card:rgba(255,255,255,0.03);
    --gold:#ffd700;
    --gold-2:#ffb700;
    --green:#00d68f;
    --green-bg:rgba(0,214,143,0.08);
    --red:#ff4757;
    --red-bg:rgba(255,71,87,0.08);
    --orange:#ffa502;
    --blue:#4a9eff;
    --blue-bg:rgba(74,158,255,0.08);
    --purple:#a55eea;
    --line:rgba(255,255,255,0.06);
    --shadow:0 8px 32px rgba(0,0,0,0.4);
    --radius:20px;
  }
  body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;overflow-x:hidden}

  /* خلفية متوهّجة */
  body::before{
    content:'';position:fixed;top:-150px;right:-100px;width:500px;height:500px;
    background:radial-gradient(circle,rgba(255,215,0,0.06) 0%,transparent 70%);
    pointer-events:none;z-index:0
  }
  body::after{
    content:'';position:fixed;bottom:-150px;left:-100px;width:400px;height:400px;
    background:radial-gradient(circle,rgba(74,158,255,0.05) 0%,transparent 70%);
    pointer-events:none;z-index:0
  }

  /* ===== الشريط العلوي ===== */
  .top-bar{
    background:rgba(7,10,18,0.85);backdrop-filter:blur(20px);
    padding:16px 20px;position:sticky;top:0;z-index:100;
    border-bottom:1px solid var(--line)
  }
  .top-bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top-bar h1{
    font-size:20px;font-weight:900;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:-0.5px
  }
  .top-bar .time{color:var(--hint);font-size:11px}
  .search-bar{display:flex;gap:8px}
  .search-bar input{
    flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:10px 16px;font-size:14px;outline:none;
    transition:all 0.2s
  }
  .search-bar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,0.1)}
  .search-bar button{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#070a12;border:none;border-radius:14px;padding:10px 18px;
    font-size:13px;font-weight:900;cursor:pointer;transition:all 0.2s
  }
  .search-bar button:active{transform:scale(0.96)}

  /* ===== شريط التنبيهات ===== */
  .alerts-bar{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
  .alerts-bar::-webkit-scrollbar{display:none}
  .alert-chip{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);
    border:1px solid var(--line);border-radius:24px;padding:8px 14px;
    font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all 0.2s
  }
  .alert-chip:active{transform:scale(0.96)}
  .alert-chip.warning{background:rgba(255,165,2,0.12);border-color:rgba(255,165,2,0.3);color:var(--orange)}
  .alert-chip.danger{background:rgba(255,71,87,0.12);border-color:rgba(255,71,87,0.3);color:var(--red)}
  .alert-chip .badge{
    background:var(--red);color:#fff;padding:2px 8px;border-radius:12px;
    font-size:10px;font-weight:900
  }

  /* ===== المحتوى ===== */
  .content{padding:16px 20px;position:relative;z-index:1}

  /* ===== البطاقات ===== */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:16px;
    box-shadow:var(--shadow);backdrop-filter:blur(10px);
    transition:all 0.3s
  }
  .card-title{
    font-size:15px;font-weight:900;color:var(--text);margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between
  }
  .card-title .see-all{
    color:var(--hint);font-size:12px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:12px;
    transition:all 0.2s
  }
  .card-title .see-all:active{transform:scale(0.95)}
  .sub{color:var(--hint);font-size:13px;line-height:1.6;margin-bottom:10px}

  /* ===== شبكة الإحصائيات ===== */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat-box{
    background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.03);
    border-radius:16px;padding:14px;text-align:center;transition:all 0.2s
  }
  .stat-box .icon{font-size:24px;margin-bottom:6px}
  .stat-label{font-size:11px;color:var(--hint);font-weight:600}
  .stat-value{font-size:20px;font-weight:900;margin-top:4px;letter-spacing:-0.5px}
  .gold{color:var(--gold)}
  .green{color:var(--green)}
  .red{color:var(--red)}
  .blue{color:var(--blue)}
  .pill{display:inline-block;background:var(--blue-bg);color:var(--blue);padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill.gold{background:rgba(255,215,0,0.1);color:var(--gold)}

  /* ===== شريط الحالة ===== */
  .status-bar{display:flex;gap:8px;flex-wrap:wrap}
  .status-item{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.03);
    border-radius:12px;padding:8px 12px;font-size:12px
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.ok{background:var(--green);box-shadow:0 0 8px rgba(0,214,143,0.4)}
  .dot.bad{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,0.4)}
  .dot.warn{background:var(--orange);box-shadow:0 0 8px rgba(255,165,2,0.4)}

  /* ===== الطلبات ===== */
  .row{
    display:flex;justify-content:space-between;gap:10px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px
  }
  .row:last-child{border:none}
  .label{color:var(--hint);font-weight:600}
  .value{font-weight:800;text-align:left;direction:ltr}
  .badge{background:var(--red);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:900}
  .badge.green{background:var(--green)}
  .pending-item{
    background:var(--red-bg);border-right:3px solid var(--red);
    border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px
  }
  .tx-id{color:var(--link);font-weight:900}
  .empty{text-align:center;color:var(--hint);padding:24px;font-size:14px}
  .recent-list{font-size:13px}
  .recent-list .item{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid var(--line)
  }
  .recent-list .item:last-child{border:none}

  /* ===== الطلبات المحسّنة ===== */
  .request-item{
    display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);
    border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px;
    transition:all 0.2s
  }
  .request-item:active{transform:scale(0.98);background:rgba(255,255,255,0.05)}
  .request-item .req-icon{
    width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0
  }
  .request-item .req-icon.deposit{background:var(--green-bg)}
  .request-item .req-icon.withdraw{background:var(--red-bg)}
  .request-item .req-info{flex:1;min-width:0}
  .request-item .req-info .req-title{font-size:13px;font-weight:700}
  .request-item .req-info .req-sub{font-size:11px;color:var(--hint);margin-top:2px}
  .request-item .req-amount{text-align:left;direction:ltr}
  .request-item .req-amount .req-value{font-size:15px;font-weight:900}
  .request-item .req-amount .req-time{font-size:11px;color:var(--hint)}
  .request-item .req-actions{display:flex;gap:5px}
  .request-item .req-actions button{
    width:36px;height:36px;border-radius:12px;border:none;font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s
  }
  .request-item .req-actions .accept{background:var(--green-bg);color:var(--green)}
  .request-item .req-actions .reject{background:var(--red-bg);color:var(--red)}

  /* ===== الرسائل ===== */
  .message-item{
    display:flex;gap:12px;background:rgba(255,255,255,0.03);
    border-radius:14px;padding:12px;margin-top:8px
  }
  .message-item .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--blue-bg);
    display:flex;align-items:center;justify-content:center;font-size:16px
  }
  .message-item .msg-content{flex:1}
  .message-item .msg-content .msg-name{font-size:12px;font-weight:700}
  .message-item .msg-content .msg-text{font-size:11px;color:var(--hint);margin-top:2px}
  .message-item .msg-time{font-size:11px;color:var(--hint)}

  /* ===== الأزرار ===== */
  .btn{
    width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#070a12;border:none;padding:14px;border-radius:16px;
    font-size:15px;font-weight:900;cursor:pointer;margin-top:8px;
    transition:all 0.2s;box-shadow:0 4px 16px rgba(255,215,0,0.15)
  }
  .btn:active{transform:scale(0.98)}
  .btn.outline{background:transparent;border:1px solid var(--gold);color:var(--gold);box-shadow:none}
  .btn.danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,71,87,0.3);box-shadow:none}
  .btn.green{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,214,143,0.3);box-shadow:none}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  /* ===== الأزرار السريعة ===== */
  .quick-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .action-btn{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:rgba(255,255,255,0.03);border:1px solid var(--line);
    border-radius:16px;padding:16px 8px;cursor:pointer;transition:all 0.2s
  }
  .action-btn:active{transform:scale(0.95);background:rgba(255,215,0,0.08);border-color:rgba(255,215,0,0.2)}
  .action-btn .action-icon{font-size:26px}
  .action-btn .action-label{font-size:11px;font-weight:700;text-align:center}

  /* ===== الإدخال ===== */
  input,textarea,select{
    width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:12px 16px;font-size:14px;
    outline:none;margin-top:6px;transition:all 0.2s
  }
  textarea{min-height:80px;resize:vertical;direction:ltr;text-align:left}
  input:focus,textarea:focus,select:focus{
    border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,0.08)
  }
  .field{margin-bottom:12px}
  .field label{font-size:12px;color:var(--hint);font-weight:800}
  .hint{font-size:11px;color:var(--hint);margin-top:4px;line-height:1.5}
  .cookie-status{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
  .cookie-status.ok{color:var(--green)}.cookie-status.bad{color:var(--red)}.cookie-status.warn{color:var(--orange)}

  /* ===== التنبيهات ===== */
  .loader{text-align:center;padding:60px 20px;color:var(--hint)}
  .spinner{
    width:40px;height:40px;border:3px solid rgba(255,215,0,0.15);
    border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{
    background:var(--red-bg);border:1px solid rgba(255,71,87,0.2);color:var(--red);
    border-radius:16px;padding:16px;text-align:center;font-size:14px;line-height:1.7
  }
  .success-box{
    background:var(--green-bg);border:1px solid rgba(0,214,143,0.2);color:var(--green);
    border-radius:16px;padding:12px;text-align:center;font-size:13px;margin-bottom:10px;font-weight:900
  }
  .warn-box{
    background:rgba(255,165,2,0.08);border:1px solid rgba(255,165,2,0.2);color:var(--orange);
    border-radius:16px;padding:12px;font-size:12px;line-height:1.7;margin-bottom:10px
  }

  /* ===== شريط التنقّل السفلي ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(7,10,18,0.95);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 0 16px;z-index:100
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    color:var(--hint);font-size:10px;font-weight:700;transition:all 0.2s;background:none;border:none
  }
  .nav-item.active{color:var(--gold)}
  .nav-item .nav-icon{font-size:22px}
  .nav-item .nav-badge{position:absolute;top:-2px;right:2px;background:var(--red);color:#fff;padding:1px 5px;border-radius:12px;font-size:9px;font-weight:900}


  /* ===== غرفة العمليات ومركز التحكم ===== */
  .ops-room{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
  .ops-card{appearance:none;-webkit-appearance:none;text-align:right;color:var(--text);font:inherit;min-height:92px;padding:13px;border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
  .ops-card::after{content:'';position:absolute;right:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--ops)}
  .ops-card .ops-top{display:flex;align-items:center;justify-content:space-between}.ops-card .ops-icon{font-size:20px}.ops-card .ops-value{font-size:25px;font-weight:950;color:var(--ops)}.ops-card .ops-label{font-size:11px;font-weight:900;margin-top:4px}.ops-card .ops-sub{font-size:9px;color:var(--hint);margin-top:3px}
  .ops-dep{--ops:var(--green)}.ops-wit{--ops:var(--red)}.ops-support{--ops:var(--blue)}.ops-system{--ops:var(--gold)}
  .oldest-request{display:flex;gap:8px;align-items:center;margin:-5px 0 15px;padding:10px 12px;border-radius:14px;background:rgba(255,165,2,.07);border:1px solid rgba(255,165,2,.17);font-size:10px;color:#d9be85}.oldest-request b{color:var(--orange)}
  .control-group{border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.025);margin-bottom:10px;overflow:hidden}.control-group summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px;font-size:12px;font-weight:900;cursor:pointer}.control-group summary::-webkit-details-marker{display:none}.control-body{border-top:1px solid var(--line);padding:5px 12px 10px}
  .control-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.045)}.control-row:last-child{border:none}.control-copy{flex:1}.control-copy b{font-size:11px}.control-copy small{display:block;color:var(--hint);font-size:9px;margin-top:2px}
  .toggle{position:relative;width:44px;height:25px;flex:0 0 auto}.toggle input{position:absolute;opacity:0}.toggle span{position:absolute;inset:0;border-radius:20px;background:#29303a;border:1px solid var(--line);transition:.2s}.toggle span::before{content:'';position:absolute;width:19px;height:19px;border-radius:50%;top:2px;right:2px;background:#747e8d;transition:.2s}.toggle input:checked+span{background:rgba(0,214,143,.15);border-color:rgba(0,214,143,.34)}.toggle input:checked+span::before{right:21px;background:var(--green);box-shadow:0 0 8px rgba(0,214,143,.4)}
  .cashier-active{padding:13px;border-radius:17px;border:1px solid rgba(255,215,0,.25);background:linear-gradient(135deg,rgba(255,215,0,.075),rgba(255,255,255,.02));margin-bottom:10px}.cashier-active-head{display:flex;align-items:center;justify-content:space-between}.cashier-active b{color:var(--gold)}.cashier-active small{color:var(--hint)}
  .cashier-address-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.cashier-address{padding:8px;border-radius:11px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.04);font-size:9px}.cashier-address span{display:block;color:var(--hint);font-size:8px}.cashier-address code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;direction:ltr;text-align:right}
  .cashier-profile{padding:11px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);margin-top:7px}.cashier-profile-head{display:flex;align-items:center;gap:8px}.cashier-profile-head b{flex:1}.cashier-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.cashier-actions .btn{padding:9px 4px;font-size:10px;margin:0}
  .cashier-form{border:1px solid rgba(255,215,0,.25);border-radius:16px;padding:12px;margin-top:10px}.cashier-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cashier-form .field{margin-bottom:8px}.cashier-form input{padding:9px 10px;font-size:12px}
  .filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}.filter-chip{appearance:none;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.025);color:var(--hint);font-size:10px;white-space:nowrap}.filter-chip.active{color:var(--gold);border-color:rgba(255,215,0,.35);background:rgba(255,215,0,.07)}
  .request-tools{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.request-tools select{margin:0;padding:9px;font-size:11px}.copy-mini{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--gold);border-radius:10px;padding:6px 9px;font-size:10px}
  .group-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.group-menu .action-btn{padding:13px 7px}

  .campaign-budget{padding:12px;border-radius:14px;background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.17);margin:10px 0}.campaign-budget b{color:var(--gold)}
  .generated-codes{max-height:280px;overflow:auto;background:#070a12;border:1px solid var(--line);border-radius:14px;padding:10px;direction:ltr;text-align:left}.generated-code{display:flex;gap:7px;align-items:center;padding:7px;border-bottom:1px solid rgba(255,255,255,.04)}.generated-code:last-child{border:0}.generated-code code{flex:1;font-size:10px;overflow:hidden;text-overflow:ellipsis}
  .campaign-card{padding:12px;border-radius:15px;background:rgba(255,255,255,.025);border:1px solid var(--line);margin-top:8px}.campaign-card-head{display:flex;align-items:center;gap:8px}.campaign-card-head b{flex:1}.campaign-progress{height:7px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden;margin:9px 0}.campaign-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}

</style>
</head>
<body>

<!-- ===== الشريط العلوي ===== -->
<div class="top-bar">
  <div class="top-bar-header">
    <h1>👑 لوحة تحكم القيصر</h1>
    <span class="time" id="lastUpdate">جارٍ التحميل...</span>
  </div>
  <div class="search-bar">
    <input type="text" id="globalSearch" placeholder="🔍 بحث عن مستخدم أو طلب...">
    <button onclick="doGlobalSearch()">بحث</button>
  </div>
</div>

<!-- ===== شريط التنبيهات ===== -->
<div class="alerts-bar" id="alertsBar"></div>

<!-- ===== المحتوى الرئيسي ===== -->
<div id="notice"></div>
<div class="content" id="content">
  <div class="loader"><div class="spinner"></div>جارٍ تحميل البيانات...</div>
</div>

<!-- ===== شريط التنقل السفلي ===== -->
<div class="bottom-nav">
  <div class="nav-item active" id="navDash" onclick="showTab('dashboard')">
    <div class="nav-icon">🏠</div>
    <span>الرئيسية</span>
  </div>
  <div class="nav-item" id="navRequests" onclick="showTab('requests')" style="position:relative">
    <div class="nav-icon">📥</div>
    <span>الطلبات</span>
    <span class="nav-badge" id="pendingBadge" style="display:none">0</span>
  </div>
  <div class="nav-item" id="navSupport" onclick="showTab('support')" style="position:relative">
    <div class="nav-icon">📩</div>
    <span>الدعم</span>
  </div>
  <div class="nav-item" id="navUsers" onclick="showTab('users')">
    <div class="nav-icon">👥</div>
    <span>المستخدمون</span>
  </div>

// 🆕 (Update 20) رسم بياني منحني انسيابي رباعي المنحنيات (Cubic Bezier Waveform)
function renderSparkline(deposits, withdraws, burnRev, commRev, labels){
  const depArr = deposits || [];
  const witArr = withdraws || [];
  const burnArr = burnRev || [];
  const commArr = commRev || [];
  const max = Math.max(...depArr, ...witArr, ...burnArr, ...commArr, 1);
  const w = 320, h = 110, pad = 14;
  const n = Math.max(depArr.length, 2);
  const step = (w - pad * 2) / (n - 1);
  
  function buildSmoothPath(arr){
    if(!arr || arr.length === 0) return { path: '', firstX: pad, lastX: pad };
    const pts = arr.map((v, i) => ({
      x: pad + i * step,
      y: (h - pad) - (v / max) * (h - pad * 2)
    }));
    let d = `M ${pts[0].x},${pts[0].y}`;
    for(let i = 0; i < pts.length - 1; i++){
      const p0 = pts[i], p1 = pts[i + 1];
      const cx1 = p0.x + (p1.x - p0.x) / 2;
      const cx2 = p1.x - (p1.x - p0.x) / 2;
      d += ` C ${cx1},${p0.y} ${cx2},${p1.y} ${p1.x},${p1.y}`;
    }
    return { path: d, firstX: pts[0].x, lastX: pts[pts.length - 1].x };
  }
  
  const depCurve = buildSmoothPath(depArr);
  const witCurve = buildSmoothPath(witArr);
  const burnCurve = buildSmoothPath(burnArr);
  const commCurve = buildSmoothPath(commArr);
  
  return `
    <div class="card" style="background:linear-gradient(180deg,rgba(15,18,28,0.95) 0%,rgba(10,12,20,0.98) 100%);border:1px solid var(--card-border);border-radius:18px;padding:16px;">
      <div class="card-title" style="margin-bottom:12px;"><span>📈 حركة السيولة ومربح الوكيل (7 أيام)</span></div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible;">
        <defs>
          <linearGradient id="depGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00d68f" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#00d68f" stop-opacity="0.0"/>
          </linearGradient>
          <linearGradient id="witGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff5252" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#ff5252" stop-opacity="0.0"/>
          </linearGradient>
        </defs>
        
        <!-- ظل المساحة تحت المنحنيات -->
        ${depCurve.path ? `<path d="${depCurve.path} L ${depCurve.lastX},${h-pad} L ${depCurve.firstX},${h-pad} Z" fill="url(#depGrad)" />` : ''}
        ${witCurve.path ? `<path d="${witCurve.path} L ${witCurve.lastX},${h-pad} L ${witCurve.firstX},${h-pad} Z" fill="url(#witGrad)" />` : ''}
        
        <!-- المنحنيات الأربعة الانسيابية -->
        ${depCurve.path ? `<path d="${depCurve.path}" fill="none" stroke="#00d68f" stroke-width="2.5" stroke-linecap="round" />` : ''}
        ${witCurve.path ? `<path d="${witCurve.path}" fill="none" stroke="#ff5252" stroke-width="2" stroke-dasharray="4" stroke-linecap="round" />` : ''}
        ${burnCurve.path ? `<path d="${burnCurve.path}" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(255,215,0,0.65))" />` : ''}
        ${commCurve.path ? `<path d="${commCurve.path}" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="2,3" stroke-linecap="round" style="filter:drop-shadow(0 0 3px rgba(0,229,255,0.5))" />` : ''}
      </svg>
      
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:10px;color:var(--hint);margin-top:12px;padding:0 2px;">
        <span style="display:flex;align-items:center;gap:4px;"><b style="color:#00d68f;font-size:13px;">●</b> إيداعات</span>
        <span style="display:flex;align-items:center;gap:4px;"><b style="color:#ff5252;font-size:13px;">- -</b> سحوبات</span>
        <span style="display:flex;align-items:center;gap:4px;"><b style="color:#ffd700;font-size:13px;text-shadow:0 0 4px #ffd700;">★</b> مربح الحرق (30%)</span>
        <span style="display:flex;align-items:center;gap:4px;"><b style="color:#00e5ff;font-size:13px;text-shadow:0 0 4px #00e5ff;">◆</b> عمولة السحب (10%)</span>
      </div>
      
      <div style="font-size:10px;color:var(--hint);margin-top:10px;line-height:1.55;background:rgba(255,255,255,0.025);padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);text-align:right;">
        💡 <b>دليل المنحنيات الأربعة:</b><br>
        🟢 <b>الإيداعات:</b> السيولة الداخلة للبوت | 🔴 <b>السحوبات:</b> الأموال المصروفة للاعبين<br>
        👑 <b>مربح الحرق (30%):</b> حصتك من خسائر اللاعبين في iChancy | 💎 <b>عمولة السحب (10%):</b> ربح المنصة من تحويل سحوبات الأرباح
      </div>
    </div>
  `;
}

let controlSettings=null;
let adminActionBusy=false;

async function copyText(value){
  try{await navigator.clipboard.writeText(String(value||''));setNotice('✅ تم النسخ')}catch(_){setNotice('تعذر النسخ','error')}
}

async function loadControlCenter(){
  currentTab='control';setNavActive('more');
  const el=document.getElementById('content');
  el.innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل مركز التحكم...</div>';
  try{controlSettings=await apiGet(SETTINGS_API);renderControlCenter(controlSettings)}catch(e){el.innerHTML=`<div class="error-box">${esc(e.message)}</div>`}
}

function gateRow(id,title,desc,checked){return `<div class="control-row"><div class="control-copy"><b>${title}</b><small>${desc}</small></div><label class="toggle"><input id="${id}" type="checkbox" ${checked?'checked':''} onchange="confirmServiceGateChange(this)"><span></span></label></div>`}
function addressBox(label,value){return `<div class="cashier-address"><span>${label}</span><code>${esc(value||'—')}</code></div>`}

  const profileHtml=profiles.map(p=>`<div class="cashier-profile"><div class="cashier-profile-head"><b>${esc(p.name)}</b>${p.id===active?.id?'<span class="pill green">نشط</span>':p.is_enabled?'<span class="pill">متاح</span>':'<span class="badge">متوقف</span>'}</div><div class="hint">Telegram ID: ${esc(p.telegram_id||'غير محدد')}</div><div class="cashier-actions"><button class="btn green" ${p.id===active?.id?'disabled':''} onclick="activateCashierProfile(${p.id})">تفعيل</button><button class="btn outline" onclick="openCashierForm(${p.id})">تعديل</button><button class="btn danger" ${p.id===active?.id?'disabled':''} onclick="deleteCashierProfile(${p.id})">حذف</button></div></div>`).join('')||'<div class="empty">لا توجد ملفات مشرفين بعد</div>';
  const auditHtml=audit.slice(0,5).map(a=>`<div class="row"><span class="label">${esc(a.switched_by)}: ${esc(a.previous_profile_name||'الافتراضي')} ← ${esc(a.new_profile_name||'—')}</span><span class="value">${esc(a.switched_at)}</span></div>`).join('')||'<div class="empty">لا توجد عمليات تبديل</div>';

    <details class="control-group" open><summary>👥 مناوبة المشرفين المالية</summary><div class="control-body">${activeHtml}<button class="btn gold" onclick="openCashierForm()">＋ إضافة مشرف جديد</button><div id="cashierForm"></div>${profileHtml}<div class="card-title" style="margin-top:14px">سجل التبديل</div>${auditHtml}</div></details>

    <details class="control-group"><summary>📣 التسويق والمحتوى</summary><div class="control-body"><div class="group-menu"><div class="action-btn" onclick="showTab('campaigns')"><div class="action-icon">🎟️</div><div class="action-label">حملات الأكواد</div></div><div class="action-btn" onclick="showTab('broadcast')"><div class="action-icon">📢</div><div class="action-label">البث الجماعي</div></div><div class="action-btn" onclick="showTab('contests')"><div class="action-icon">👑</div><div class="action-label">المسابقات</div></div><div class="action-btn" onclick="showTab('predictions')"><div class="action-icon">🎫</div><div class="action-label">التوقعات</div></div><div class="action-btn" onclick="showTab('features')"><div class="action-icon">⚡</div><div class="action-label">فلاش البونص</div></div></div></div></details>

function confirmServiceGateChange(input){
  const title=input.closest('.control-row').querySelector('b').textContent;const intended=input.checked;
  tg.showConfirm(`${intended?'تفعيل':'إيقاف'} ${title}؟`,async ok=>{if(!ok){input.checked=!intended;return}await saveServiceGates()});
}
async function saveServiceGates(){
  if(adminActionBusy)return;adminActionBusy=true;
  try{await apiPost(SETTINGS_API,{action:'update_service_gates',maintenance_mode:document.getElementById('gate_maintenance').checked,deposits_enabled:document.getElementById('gate_deposits').checked,withdrawals_enabled:document.getElementById('gate_withdrawals').checked,game_transfers_enabled:document.getElementById('gate_game').checked});setNotice('✅ تم تحديث بوابات الخدمة');await loadControlCenter()}catch(e){setNotice('❌ '+e.message,'error');await loadControlCenter()}finally{adminActionBusy=false}
}

function openCashierForm(profileId=null){
  const p=(controlSettings?.cashier_profiles||[]).find(x=>x.id===profileId)||{};
  document.getElementById('cashierForm').innerHTML=`<div class="cashier-form"><div class="card-title">${profileId?'تعديل':'إضافة'} ملف مشرف</div><input type="hidden" id="cashier_profile_id" value="${profileId||''}"><div class="cashier-form-grid"><div class="field"><label>اسم المشرف</label><input id="cashier_name" value="${esc(p.name||'')}"></div><div class="field"><label>Telegram ID</label><input id="cashier_telegram" value="${esc(p.telegram_id||'')}"></div></div><div class="field"><label>شام كاش SYP</label><input id="cashier_sham_syp" value="${esc(p.sham_syp_address||'')}"></div><div class="field"><label>شام كاش USD</label><input id="cashier_sham_usd" value="${esc(p.sham_usd_address||'')}"></div><div class="cashier-form-grid"><div class="field"><label>سيريتل كاش</label><input id="cashier_syriatel" value="${esc(p.syriatel_address||'')}"></div><div class="field"><label>MTN كاش</label><input id="cashier_mtn" value="${esc(p.mtn_address||'')}"></div></div><div class="btn-row"><button class="btn green" onclick="saveCashierProfile()">💾 حفظ</button><button class="btn outline" onclick="document.getElementById('cashierForm').innerHTML=''">إلغاء</button></div></div>`;
  document.getElementById('cashierForm').scrollIntoView({behavior:'smooth',block:'center'});
}
async function saveCashierProfile(){
  if(adminActionBusy)return;const id=val('cashier_profile_id');const payload={action:id?'update_cashier_profile':'create_cashier_profile',profile_id:id||undefined,name:val('cashier_name'),telegram_id:val('cashier_telegram'),sham_syp_address:val('cashier_sham_syp'),sham_usd_address:val('cashier_sham_usd'),syriatel_address:val('cashier_syriatel'),mtn_address:val('cashier_mtn'),is_enabled:true};adminActionBusy=true;
  try{await apiPost(SETTINGS_API,payload);setNotice('✅ تم حفظ ملف المشرف');await loadControlCenter()}catch(e){setNotice('❌ '+e.message,'error')}finally{adminActionBusy=false}
}
function activateCashierProfile(id){const name=(controlSettings?.cashier_profiles||[]).find(x=>x.id===id)?.name||'المشرف';tg.showConfirm(`تفعيل ${name}؟ ستستخدم الطلبات الجديدة عناوينه فورًا.`,async ok=>{if(!ok||adminActionBusy)return;adminActionBusy=true;try{await apiPost(SETTINGS_API,{action:'activate_cashier_profile',profile_id:id});setNotice('✅ تم تبديل المشرف النشط');await loadControlCenter()}catch(e){setNotice('❌ '+e.message,'error')}finally{adminActionBusy=false}})}
function deleteCashierProfile(id){tg.showConfirm('حذف ملف المشرف غير النشط؟',async ok=>{if(!ok||adminActionBusy)return;adminActionBusy=true;try{await apiPost(SETTINGS_API,{action:'delete_cashier_profile',profile_id:id});setNotice('✅ تم حذف الملف');await loadControlCenter()}catch(e){setNotice('❌ '+e.message,'error')}finally{adminActionBusy=false}})}

async function loadSettings(tab=currentTab,force=false){
  currentTab=tab;setNavActive('more');
  const el=document.getElementById('content');
  el.innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل الإعدادات...</div>';
  try{
    settingsData=await apiGet(SETTINGS_API);
    if(tab==='settings')renderSettings(settingsData);

    document.getElementById('lastUpdate').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');

}

function okBadge(x){return x?'<span class="badge green">سليم</span>':'<span class="badge">مشكلة</span>'}
// شريط نسبة استخدام Neon مع تلوّن حسب العتبة
function neonBar(label,used,limit,unit,pct){pct=(typeof pct==='number')?pct:0;const color=pct>=90?'#e5484d':(pct>=70?'#e5a54d':'#30a46c');const w=Math.max(0,Math.min(100,pct));return `<div class="row"><span class="label">${label}</span><span class="value">${(used||0).toLocaleString('en-US',{maximumFractionDigits:3})} / ${limit} ${unit} <b style="color:${color}">${pct}%</b></span></div><div style="background:rgba(255,255,255,.08);border-radius:6px;height:8px;overflow:hidden;margin:4px 0 10px"><div style="height:100%;width:${w}%;background:${color};border-radius:6px;transition:width .4s"></div></div>`}
function neonCard(n){
  if(!n||n.ok===false){const reason=(n&&(n.error||n.refresh_error))||'غير متاح';const notConfigured=n&&n.configured===false;return `<div class="card"><div class="card-title">🗄️ Neon Database</div><div class="warn-box">${notConfigured?'⚙️ لم تُضبط متغيرات Neon (NEON_API_KEY / NEON_PROJECT_ID).':'⚠️ تعذّر جلب مقاييس Neon:'}<br>${reason}</div></div>`}
  const p=n.usage_percent||{},lim=n.limits||{};const overall=p.overall||0;
  const statusTxt=overall>=90?'🔴 قريب من الحد الأقصى':(overall>=70?'🟡 يقترب من الحد':'🟢 ضمن الحدود الآمنة');
  const staleTag=(n.cache&&n.cache.stale)?'<span class="badge" style="margin-inline-start:6px">بيانات مخزّنة</span>':'';
  const alert=overall>=70?`<div class="warn-box">⚠️ الاستخدام الكلي ${overall}% — يُنصح بالمراقبة${overall>=90?' أو الترقية':''}.</div>`:'';
  return `<div class="card"><div class="card-title"><span>🗄️ Neon Database</span><span class="value" style="font-size:.8rem">${statusTxt}${staleTag}</span></div>
  ${alert}
  ${neonBar('🧮 Compute',n.compute_hours,lim.compute_cu_hours||100,'ساعة',p.compute)}
  ${neonBar('💾 Storage',n.storage_gb,lim.storage_gb||0.5,'GB',p.storage)}
  ${neonBar('🌐 Transfer',n.transfer_gb,lim.transfer_gb||5,'GB',p.transfer)}
  <div class="row"><span class="label">🌿 عدد الفروع</span><span class="value">${(typeof n.branches_count==='number')?n.branches_count:'—'}</span></div>
  <div class="row"><span class="label">🔄 دورة الاستهلاك منذ</span><span class="value">${n.hours_elapsed?Math.round(n.hours_elapsed)+' ساعة':'—'}</span></div>
  </div>`
}
function renderRenderCard(r){
  if(!r||r.ok===false){const reason=(r&&(r.error||r.refresh_error))||'غير متاح';const notConfigured=r&&r.configured===false;return `<div class="card"><div class="card-title">☁️ Render</div><div class="warn-box">${notConfigured?'⚙️ لم تُضبط متغيرات Render (RENDER_API_KEY / RENDER_SERVICE_ID).':'⚠️ تعذّر جلب حالة Render:'}<br>${reason}</div></div>`}
  const suspended=r.suspended===true;
  const statusBadge=suspended?'<span class="badge">🔴 معلّقة</span>':'<span class="badge green">🟢 نشطة</span>';
  const dep=r.last_deploy||{};
  const depColor=dep.status==='live'?'#30a46c':(dep.status&&dep.status.indexOf('fail')>=0?'#e5484d':'');
  const staleTag=(r.cache&&r.cache.stale)?'<span class="badge" style="margin-inline-start:6px">بيانات مخزّنة</span>':'';
  const suspendAlert=suspended?'<div class="warn-box">🔴 الخدمة معلّقة (قد تكون ساعات التشغيل المجانية نفدت). راجع لوحة Render.</div>':'';
  const bw=(typeof r.bandwidth_24h_mb==='number')?`<div class="row"><span class="label">🌐 النطاق (24 ساعة)</span><span class="value">${r.bandwidth_24h_mb} MB</span></div>`:(r.bandwidth_note?`<div class="row"><span class="label">🌐 النطاق</span><span class="value" style="font-size:.8rem">${r.bandwidth_note}</span></div>`:'');
  const probe=r.probe?`<div class="row"><span class="label">⚡ الاستجابة</span><span class="value">${r.probe.state==='cold_start'?'❄️ استيقاظ ('+r.probe.latency_ms+'ms)':(r.probe.state==='warm'?'✅ نشطة ('+r.probe.latency_ms+'ms)':'⚠️ غير متصلة')}</span></div>`:'';
  return `<div class="card"><div class="card-title"><span>☁️ Render</span><span>${statusBadge}${staleTag}</span></div>
  ${suspendAlert}
  <div class="row"><span class="label">📛 الخدمة</span><span class="value">${r.name||'—'}</span></div>
  <div class="row"><span class="label">💳 الخطة</span><span class="value">${r.plan||'—'}${r.region?' · '+r.region:''}</span></div>
  <div class="row"><span class="label">🚀 آخر نشر</span><span class="value" style="color:${depColor}">${dep.status||'—'}</span></div>
  ${dep.finished_at?`<div class="row"><span class="label">🕐 وقت النشر</span><span class="value">${dep.finished_at}</span></div>`:''}
  ${bw}${probe}
  <div class="row" style="opacity:.7"><span class="label" style="font-size:.75rem">ℹ️ الساعات المتبقية</span><span class="value" style="font-size:.72rem">تُراجع من لوحة Render (غير متاحة عبر API)</span></div>
  </div>`
}
function renderHealth(d,neon,render){const wh=d.webhook||{},db=d.database||{},srv=d.server||{},ich=d.ichancy||{},cash=d.cashier||{},st=d.stats||{};document.getElementById('content').innerHTML=`

<div class="card"><div class="card-title">📊 أرقام سريعة</div><div class="row"><span class="label">👥 المستخدمون</span><span class="value">${fmt(st.total_users)}</span></div><div class="row"><span class="label">⏳ الطلبات المعلقة</span><span class="value">${fmt(st.pending_requests)}</span></div><div class="row"><span class="label">🔄 معاملات اليوم</span><span class="value">${fmt(st.today_tx)}</span></div></div>

// ===== مركز الدعم =====
async function supportApi(payload){return apiPost(SUPPORT_API,payload);}
function loadSupport(status='open'){currentTab='support';setNavActive('support');document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل تذاكر الدعم...</div>';supportApi({action:'list',status,limit:50}).then(d=>renderSupportList(d,status)).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div>`})}

function renderSupportList(d,status){const tickets=d.tickets||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">📩 مركز الدعم</div><div class="btn-row-3"><button class="btn ${status==='open'?'green':'outline'}" onclick="loadSupport('open')">مفتوحة</button><button class="btn ${status==='closed'?'green':'outline'}" onclick="loadSupport('closed')">مغلقة</button><button class="btn ${status==='all'?'green':'outline'}" onclick="loadSupport('all')">الكل</button></div></div>
<div class="card"><div class="card-title">🎫 التذاكر (${tickets.length})</div>${tickets.map(t=>`<div class="pending-item"><b>#${t.id} ${t.telegram_username||t.user_telegram_id}</b> • ${t.status==='open'?'🟢 مفتوحة':'🔒 مغلقة'}<br>🎮 ${t.ichancy_username||'—'} | 💎 ${fmt(t.bot_balance)} SYP<br>${t.last_message||''}<br><span class="label">${t.last_message_at||t.created_at||''}</span><button class="btn outline" onclick="loadSupportTicket(${t.id})">👁️ فتح</button></div>`).join('')||'<div class="empty">لا توجد تذاكر</div>'}</div>`;}

function loadSupportTicket(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل التذكرة...</div>';supportApi({action:'detail',ticket_id:id}).then(renderSupportTicket).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadSupport()">🔙 رجوع</button>`})}

function renderSupportTicket(d){const t=d.ticket||{},u=d.user||{},msgs=d.messages||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">🎫 تذكرة #${t.id}</div><div class="row"><span class="label">المستخدم</span><span class="value">${u.telegram_username||t.user_telegram_id}</span></div><div class="row"><span class="label">iChancy</span><span class="value">${u.ichancy_username||'—'}</span></div><div class="row"><span class="label">الحالة</span><span>${t.status==='open'?'🟢 مفتوحة':'🔒 مغلقة'}</span></div><button class="btn outline" onclick="loadUserDetail('${t.user_telegram_id}')">👥 ملف المستخدم</button></div>
<div class="card"><div class="card-title">💬 المحادثة</div>${msgs.map(m=>`<div class="pending-item" style="border-right-color:${m.sender_type==='admin'?'var(--green)':'var(--blue)'}"><b>${m.sender_type==='admin'?'👑 الإدارة':'👤 المستخدم'}</b><br>${m.message_text||'['+(m.content_type||'message')+']'}<br><span class="label">${m.created_at||''}</span></div>`).join('')||'<div class="empty">لا توجد رسائل</div>'}</div>
<div class="card"><div class="card-title">↩️ رد الإدارة</div><div class="field"><label>رد جاهز</label><select onchange="applySupportTemplate(this.value)"><option value="">اختر ردًا...</option><option value="review">طلبك قيد المراجعة</option><option value="proof">يرجى إرسال رقم العملية/الإثبات</option><option value="address">يرجى التأكد من عنوان الاستلام</option><option value="done">تم حل المشكلة</option></select></div><textarea id="support_reply_text" style="direction:rtl;text-align:right" placeholder="اكتب الرد..." oninput="saveSupportDraft(${t.id})"></textarea><button class="btn green" onclick="sendSupportReply(${t.id})">📩 إرسال الرد</button><button class="btn outline" onclick="closeSupportTicket(${t.id})">🔒 إغلاق</button><button class="btn outline" onclick="loadSupport()">🔙 رجوع</button></div>`;restoreSupportDraft(t.id)}

const SUPPORT_TEMPLATES={review:'مرحباً، طلبك قيد المراجعة حاليًا وسيتم إشعارك فور الانتهاء.',proof:'يرجى إرسال رقم العملية أو صورة إثبات التحويل حتى نتمكن من المتابعة.',address:'يرجى التأكد من عنوان أو رقم الاستلام وإرساله مرة أخرى بدقة.',done:'تم حل المشكلة بنجاح. نحن في خدمتك دائمًا.'};
function applySupportTemplate(key){const el=document.getElementById('support_reply_text');if(el&&SUPPORT_TEMPLATES[key]){el.value=SUPPORT_TEMPLATES[key];el.dispatchEvent(new Event('input'))}}
function saveSupportDraft(id){try{localStorage.setItem('caesar_support_draft_'+id,val('support_reply_text'))}catch(_){}}
function restoreSupportDraft(id){setTimeout(()=>{try{const draft=localStorage.getItem('caesar_support_draft_'+id);if(draft)document.getElementById('support_reply_text').value=draft}catch(_){}},0)}
function clearSupportDraft(id){try{localStorage.removeItem('caesar_support_draft_'+id)}catch(_){}}
function sendSupportReply(id){const msg=val('support_reply_text');if(!msg.trim()){setNotice('❌ الرد فارغ','error');return}supportApi({action:'reply',ticket_id:id,message:msg}).then(()=>{clearSupportDraft(id);setNotice('✅ تم إرسال الرد');loadSupportTicket(id)}).catch(e=>setNotice('❌ '+e.message,'error'))}
function closeSupportTicket(id){tg.showConfirm('إغلاق التذكرة؟',ok=>{if(!ok)return;supportApi({action:'close',ticket_id:id}).then(()=>{setNotice('✅ تم الإغلاق');loadSupport('open')}).catch(e=>setNotice('❌ '+e.message,'error'))})}

// ===== مركز الطلبات =====
async function requestsApi(payload){return apiPost(REQUESTS_API,payload);}
function typeLabel(t){return t==='deposit_bot'?'📥 إيداع':t==='withdraw_bot'?'📤 سحب':t==='deposit_to_game'?'🎮 شحن لعبة':t==='withdraw_from_game'?'↩️ سحب لعبة':t||'—'}
function statusLabel(s){return s==='pending'?'🟡 معلّق':s==='approved'?'✅ مقبول':s==='rejected'?'❌ مرفوض':s==='completed'?'🟢 مكتمل':s||'—'}

function loadRequests(){currentTab='requests';setNavActive('requests');try{requestFilter=localStorage.getItem('caesar_request_filter')||requestFilter;requestSort=localStorage.getItem('caesar_request_sort')||requestSort}catch(_){}document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل الطلبات...</div>';requestsApi({action:'list',limit:40}).then(renderRequests).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div>`})}

let requestViewData=null;
let requestFilter='pending';
let requestSort='oldest';
function renderRequests(d){requestViewData=d;renderRequestsView()}
function requestAge(createdAt){const dt=new Date(String(createdAt||'').replace(' ','T'));if(Number.isNaN(dt.getTime()))return '';const mins=Math.max(0,Math.floor((Date.now()-dt.getTime())/60000));if(mins<60)return `${mins} دقيقة`;if(mins<1440)return `${Math.floor(mins/60)} ساعة`;return `${Math.floor(mins/1440)} يوم`}
function setRequestFilter(filter){requestFilter=filter;try{localStorage.setItem('caesar_request_filter',filter)}catch(_){}renderRequestsView()}
function setRequestSort(sort){requestSort=sort;try{localStorage.setItem('caesar_request_sort',sort)}catch(_){}renderRequestsView()}
function renderRequestsView(){
  const d=requestViewData||{};const sm=d.summary||{};const pending=d.pending||[];const recent=d.recent||[];
  let items=requestFilter==='pending'?[...pending]:[...pending,...recent.filter(r=>!pending.some(p=>p.id===r.id))];
  if(requestFilter==='deposit')items=items.filter(x=>x.type==='deposit_bot');
  else if(requestFilter==='withdraw')items=items.filter(x=>x.type==='withdraw_bot');
  else if(requestFilter==='game')items=items.filter(x=>String(x.type||'').includes('game'));
  if(requestSort==='amount')items.sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));
  else items.sort((a,b)=>{const av=new Date(String(a.created_at||'').replace(' ','T')).getTime()||0;const bv=new Date(String(b.created_at||'').replace(' ','T')).getTime()||0;return requestSort==='newest'?bv-av:av-bv});
  document.getElementById('content').innerHTML=`
  <div class="card"><div class="card-title">📥 مركز الطلبات</div><div class="field"><label>بحث</label><input id="req_search_q" placeholder="رقم الطلب أو مستخدم"></div><button class="btn green" onclick="searchRequests()">🔎 بحث</button></div>
  <div class="card"><div class="card-title">📊 ملخص</div><div class="stat-grid"><div class="stat-box"><div class="stat-label">⏳ معلقة</div><div class="stat-value gold">${fmt(sm.pending_total)}</div></div><div class="stat-box"><div class="stat-label">📥 إيداع</div><div class="stat-value blue">${fmt(sm.pending_deposits)}</div></div><div class="stat-box"><div class="stat-label">📤 سحب</div><div class="stat-value red">${fmt(sm.pending_withdraws)}</div></div><div class="stat-box"><div class="stat-label">🔄 اليوم</div><div class="stat-value green">${fmt(sm.today_tx)}</div></div></div></div>
  <div class="card"><div class="card-title">🔎 الفرز السريع</div><div class="filter-bar">${[['pending','المعلقة'],['all','الكل'],['deposit','إيداع'],['withdraw','سحب'],['game','اللعبة']].map(([k,l])=>`<button class="filter-chip ${requestFilter===k?'active':''}" onclick="setRequestFilter('${k}')">${l}</button>`).join('')}</div><div class="request-tools"><select onchange="setRequestSort(this.value)"><option value="oldest" ${requestSort==='oldest'?'selected':''}>الأقدم أولًا</option><option value="newest" ${requestSort==='newest'?'selected':''}>الأحدث أولًا</option><option value="amount" ${requestSort==='amount'?'selected':''}>الأكبر مبلغًا</option></select><span class="pill">${items.length} طلب</span></div></div>
  <div class="card"><div class="card-title">📋 النتائج</div>${items.map(renderReqItem).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`;
}
function renderReqItem(t){const age=requestAge(t.created_at);return `<div class="pending-item"><b>#${t.id} ${typeLabel(t.type)}</b> • ${statusLabel(t.status)}${age?` <span class="pill">${age}</span>`:''}<br>👤 ${esc(t.telegram_username||'—')} <span class="label">${esc(t.user_telegram_id)}</span><br>💰 <b>${fmt(t.amount)} SYP</b> | 💳 ${esc(t.payment_method||'—')}${t.cashier_profile_name?`<br>👑 مشرف الاستلام: <b>${esc(t.cashier_profile_name)}</b>`:''}${t.payment_destination?`<br>🏦 <code>${esc(t.payment_destination)}</code>`:''}<br><span class="label">${esc(t.created_at||'')}</span><div class="btn-row"><button class="btn outline" onclick="loadRequestDetail(${t.id})">👁️ التفاصيل</button><button class="copy-mini" onclick="copyText('${String(t.amount||0).replace(/'/g,'')}')">⧉ نسخ المبلغ</button></div></div>`}

function searchRequests(){const q=val('req_search_q').trim();if(!q){setNotice('أدخل قيمة','error');return}document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ البحث...</div>';requestsApi({action:'search',query:q}).then(d=>{document.getElementById('content').innerHTML=`<div class="card"><div class="card-title">🔎 النتائج</div><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button>${(d.items||[]).map(renderReqItem).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`}).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button>`})}

function loadRequestDetail(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل التفاصيل...</div>';requestsApi({action:'detail',tx_id:id}).then(renderRequestDetail).catch(e=>{document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button>`})}

function renderRequestDetail(d){const t=d.transaction||{},u=d.user||{},h=d.history||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">📌 الطلب #${t.id}</div><div class="row"><span class="label">النوع</span><span class="value">${typeLabel(t.type)}</span></div><div class="row"><span class="label">الحالة</span><span>${statusLabel(t.status)}</span></div><div class="row"><span class="label">المبلغ</span><span class="value gold">${fmt(t.amount)} SYP</span></div><div class="row"><span class="label">الوسيلة</span><span class="value">${esc(t.payment_method||'—')}</span></div>${t.cashier_profile_name?`<div class="row"><span class="label">مشرف الاستلام</span><span class="value gold">${esc(t.cashier_profile_name)}</span></div>`:''}${t.payment_destination?`<div class="row"><span class="label">العنوان المثبت</span><span class="value"><code>${esc(t.payment_destination)}</code> <button class="copy-mini" onclick="copyText(this.previousElementSibling.textContent)">⧉</button></span></div>`:''}<div class="row"><span class="label">التاريخ</span><span class="value">${t.created_at||'—'}</span></div><div class="hint">${esc(t.transfer_number||'')}</div></div>
<div class="card"><div class="card-title">👤 المستخدم</div><div class="row"><span class="label">Telegram</span><span class="value">${u.telegram_id||t.user_telegram_id}</span></div><div class="row"><span class="label">Username</span><span class="value">${u.telegram_username||'—'}</span></div><div class="row"><span class="label">iChancy</span><span class="value">${u.ichancy_username||'—'}</span></div><div class="row"><span class="label">رصيد البوت</span><span class="value gold">${fmt(u.bot_balance)} SYP</span></div><button class="btn outline" onclick="promptRequestMessage('${u.telegram_id||t.user_telegram_id}',${t.id})">📩 رسالة للمستخدم</button><button class="btn outline" onclick="loadUserDetail('${u.telegram_id||t.user_telegram_id}')">👥 ملف المستخدم</button><div class="warn-box" style="margin-top:10px">⚠️ حذف الطلب نهائي يُزيله من كل السجلات. ${t.type==='withdraw_bot'||t.type==='deposit_to_game'?'هذا طلب سحب/شحن، رصيده <b>مخصوم من المستخدم</b>. يمكنك إعادته عند الحذف.':'هذا طلب إيداع، رصيده <b>لم يُضاف بعد</b>، لذا لا حاجة لإعادة.'}</div><button class="btn danger" onclick="deleteTransaction(${t.id},${t.type==='withdraw_bot'||t.type==='deposit_to_game'?'true':'false'})">🗑️ حذف الطلب نهائياً</button><button class="btn outline" onclick="loadRequests()">🔙 رجوع</button></div>
<div class="card"><div class="card-title">🕒 آخر معاملات</div>${h.map(x=>`<div class="pending-item"><b>#${x.id} ${x.type}</b> • ${x.status}<br>💰 ${fmt(x.amount)} | ${x.created_at}</div>`).join('')||'<div class="empty">لا يوجد سجل</div>'}</div>`}

function promptRequestMessage(tid,id){const msg=prompt('رسالة للمستخدم بخصوص الطلب #'+id);if(!msg)return;requestsApi({action:'message_user',telegram_id:tid,message:msg}).then(()=>setNotice('✅ تم إرسال الرسالة')).catch(e=>setNotice('❌ '+e.message,'error'))}
function deleteTransaction(id,refund){const msg=refund?'⚠️ حذف الطلب نهائياً مع إعادة الرصيد للمستخدم؟':'⚠️ حذف الطلب نهائياً (بدون إعادة رصيد)؟';tg.showConfirm(msg,async ok=>{if(!ok)return;try{const r=await requestsApi({action:'delete_transaction',tx_id:id,refund});if(r.refunded>0){setNotice('✅ تم حذف الطلب وإعادة '+fmt(r.refunded)+' SYP للمستخدم')}else{setNotice('🗑️ تم حذف الطلب')}loadRequests();}catch(e){setNotice('❌ '+e.message,'error')}})}

function loadUsers(){currentTab='users';setNavActive('users');document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">👥 مركز المستخدمين</div><div class="sub">ابحث بـ Telegram ID أو @username أو اسم iChancy أو Player ID.</div><div class="field"><label>بحث</label><input id="user_search_q" placeholder="مثال: 123456 أو username"></div><button class="btn green" onclick="searchUsers()">🔎 بحث</button></div><div id="usersResult"></div>`;}

async function searchUsers(){const q=val('user_search_q').replace('@','').trim();const box=document.getElementById('usersResult');if(!q){box.innerHTML='<div class="error-box">أدخل قيمة</div>';return}box.innerHTML='<div class="loader"><div class="spinner"></div>جارٍ البحث...</div>';try{const d=await usersApi({action:'search',query:q});const users=d.users||[];box.innerHTML=`<div class="card"><div class="card-title">🔎 النتائج (${users.length})</div>${users.map(u=>`<div class="pending-item"><b>${u.telegram_username||'بدون معرف'}</b> <span class="label">${u.telegram_id}</span><br>🎮 ${u.ichancy_username||'غير مرتبط'} | 🔑 ${u.player_id||'—'}<br>💎 ${fmt(u.bot_balance)} SYP | 🎮 ${fmt(u.game_balance)} NSP<button class="btn outline" onclick="loadUserDetail('${u.telegram_id}')">👁️ التفاصيل</button></div>`).join('')||'<div class="empty">لا توجد نتائج</div>'}</div>`;}catch(e){box.innerHTML=`<div class="error-box">${e.message}</div>`}}

<div class="btn-row"><button class="btn outline" onclick="refreshUserGameBalance('${u.telegram_id}')">🔄 رصيد اللعبة</button><button class="btn outline" onclick="promptAdjustBalance('${u.telegram_id}')">💎 تعديل الرصيد</button></div>
<button class="btn outline" onclick="promptMessageUser('${u.telegram_id}')">📩 رسالة للمستخدم</button></div>
<div class="card"><div class="card-title">🕒 آخر المعاملات</div>${h.map(t=>`<div class="pending-item"><b>#${t.id} ${t.type}</b> • ${t.status}<br>💰 ${fmt(t.amount)} | ${t.payment_method||'—'}<br><span class="label">${t.created_at}</span></div>`).join('')||'<div class="empty">لا توجد معاملات</div>'}</div>`}

async function refreshUserGameBalance(tid){try{setNotice('جارٍ تحديث الرصيد...');const d=await usersApi({action:'refresh_game_balance',telegram_id:tid});setNotice(`✅ رصيد اللعبة: ${fmt(d.game_balance)} NSP`);loadUserDetail(tid);}catch(e){setNotice('❌ '+e.message,'error')}}
function promptAdjustBalance(tid){const delta=prompt('أدخل قيمة الإضافة/الخصم. مثال: 5000 أو -3000');if(delta===null)return;usersApi({action:'adjust_balance',telegram_id:tid,delta}).then(()=>{setNotice('✅ تم تعديل الرصيد');loadUserDetail(tid)}).catch(e=>setNotice('❌ '+e.message,'error'))}
function promptMessageUser(tid){const msg=prompt('اكتب الرسالة:');if(!msg)return;usersApi({action:'message',telegram_id:tid,message:msg}).then(()=>setNotice('✅ تم إرسال الرسالة')).catch(e=>setNotice('❌ '+e.message,'error'))}

async function bonusesApi(payload){return apiPost(BONUSES_API,payload);}
async function loadBonuses(){currentTab='bonuses';setNavActive('more');document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل البونصات...</div>';try{const d=await bonusesApi({action:'summary'});renderBonuses(d);}catch(e){document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div>`}}

function renderBonuses(d){const bs=d.bonus_summary||{},rs=d.referral_summary||{},aff=d.affiliate_summary||{},st=d.settings||{},rules=d.bonus_rules||[],top=d.top_referrers||[],recent=d.recent_commissions||[];document.getElementById('content').innerHTML=`

<div class="card"><div class="card-title">📊 ملخص</div><div class="row"><span class="label">🎁 عروض البونص</span><span class="value">${fmt(bs.total_rules)} / النشطة ${fmt(bs.active_rules)}</span></div><div class="row"><span class="label">👥 الإحالات</span><span class="value">${fmt(rs.total_referrals)} مسجلة | ${fmt(rs.active_referrals)} نشطة</span></div><div class="row"><span class="label">💵 أرباح إحالات قابلة للسحب</span><span class="value gold">${fmt(aff.total_paid||0)} SYP</span></div></div>

<div class="card"><div class="card-title">➕ إنشاء عرض بونص</div><div class="field"><label>اسم العرض</label><input id="bonus_title" placeholder="مثال: بونص العيد"></div><div class="field"><label>النسبة %</label><input id="bonus_percent" inputmode="decimal" placeholder="10"></div><div class="field"><label>طريقة الدفع</label><select id="bonus_method"><option value="all">كل الطرق</option><option value="syriatel">سيرياتيل</option><option value="mtn">MTN</option><option value="sham_syp">شام كاش SYP</option><option value="sham_usd">شام كاش USD</option><option value="usdt_trc">USDT TRC20</option><option value="usdt_bep">USDT BEP20</option></select></div><div class="field"><label>الحد الأدنى SYP</label><input id="bonus_min" inputmode="numeric" value="0"></div><div class="field"><label>الحد الأعلى SYP</label><input id="bonus_max" inputmode="numeric" value="0"></div><button class="btn green" onclick="createBonusRule()">✅ إنشاء</button></div>
<div class="card"><div class="card-title">📋 العروض الحالية</div>${rules.map(r=>{const methodMap={'all':'كل الطرق','syriatel':'🟢 سيريتل كاش','mtn':'🟡 MTN كاش','sham_syp':'📱 شام كاش SYP','sham_usd':'💵 شام كاش USD','usdt_trc':'🪙 USDT TRC20','usdt_bep':'🪙 USDT BEP20'};const methodName=methodMap[r.payment_method]||r.payment_method;return `<div class="pending-item" style="border-right-color:${r.is_active?'var(--green)':'var(--red)'}"><b>#${r.id} ${r.title}</b> ${r.is_active?'<span class="pill green">فعّال</span>':'<span class="pill">متوقف</span>'}<br>📈 ${r.percent}% | 💳 ${methodName}<br>💰 حد أدنى: ${fmt(r.min_amount_syp)} | 🛡️ حد أعلى: ${fmt(r.max_bonus_syp)}<div class="btn-row-3">${r.is_active?`<button class="btn danger" onclick="disableBonusRule(${r.id})">🛑 إيقاف</button>`:`<button class="btn green" onclick="enableBonusRule(${r.id})">✅ تفعيل</button>`}<button class="btn outline" onclick="editBonusRule(${r.id},'${String(r.title).replace(/'/g,"\\'")}',${r.percent},'${r.payment_method}',${r.min_amount_syp},${r.max_bonus_syp})">✏️ تعديل</button><button class="btn danger" onclick="deleteBonusRule(${r.id})">🗑️ حذف</button></div></div>`}).join('')||'<div class="empty">لا توجد عروض</div>'}</div>
<div id="bonusEditBox"></div>
<div class="card"><div class="card-title">🏆 أفضل المُحيلين</div>${top.map(r=>`<div class="pending-item"><b>${r.telegram_username||r.referrer_telegram_id}</b><br>👥 ${fmt(r.total_referrals)} | ✅ ${fmt(r.active_referrals)} | 📈 ${r.current_percent}%<br>💰 ${fmt(r.total_earnings)} SYP</div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div>

async function createBonusRule(){try{await bonusesApi({action:'create_bonus',title:val('bonus_title'),percent:val('bonus_percent'),payment_method:val('bonus_method'),min_amount_syp:val('bonus_min'),max_bonus_syp:val('bonus_max')});setNotice('✅ تم إنشاء العرض');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
async function enableBonusRule(id){try{await bonusesApi({action:'enable_bonus',rule_id:id});setNotice('✅ تم تفعيل العرض');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
async function deleteBonusRule(id){tg.showConfirm('حذف العرض نهائياً؟',async ok=>{if(!ok)return;try{await bonusesApi({action:'delete_bonus',rule_id:id});setNotice('🗑️ تم حذف العرض');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}})}
function editBonusRule(id,title,percent,method,min,max){const methodMap={'all':'كل الطرق','syriatel':'سيريتل','mtn':'MTN','sham_syp':'شام SYP','sham_usd':'شام USD','usdt_trc':'USDT TRC20','usdt_bep':'USDT BEP20'};const opts=Object.entries(methodMap).map(([k,v])=>`<option value="${k}" ${k===method?'selected':''}>${v}</option>`).join('');document.getElementById('bonusEditBox').innerHTML=`<div class="card" style="border:2px solid var(--gold)"><div class="card-title">✏️ تعديل العرض #${id}</div><div class="field"><label>اسم العرض</label><input id="edit_title" value="${title}"></div><div class="field"><label>النسبة %</label><input id="edit_percent" inputmode="decimal" value="${percent}"></div><div class="field"><label>طريقة الدفع</label><select id="edit_method">${opts}</select></div><div class="field"><label>الحد الأدنى SYP</label><input id="edit_min" inputmode="numeric" value="${min}"></div><div class="field"><label>الحد الأعلى SYP</label><input id="edit_max" inputmode="numeric" value="${max}"></div><div class="btn-row"><button class="btn green" onclick="saveBonusEdit(${id})">💾 حفظ التعديل</button><button class="btn outline" onclick="document.getElementById('bonusEditBox').innerHTML=''">❌ إلغاء</button></div></div>`;document.getElementById('bonusEditBox').scrollIntoView({behavior:'smooth'})}
async function saveBonusEdit(id){try{await bonusesApi({action:'update_bonus',rule_id:id,title:val('edit_title'),percent:val('edit_percent'),payment_method:document.getElementById('edit_method').value,min_amount_syp:val('edit_min'),max_bonus_syp:val('edit_max')});setNotice('✅ تم حفظ التعديل');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
async function disableBonusRule(id){try{await bonusesApi({action:'disable_bonus',rule_id:id});setNotice('✅ تم الإيقاف');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}}
function toggleReferrals(enabled){tg.showConfirm((enabled?'تفعيل':'إيقاف')+' الإحالات؟',async ok=>{if(!ok)return;try{await bonusesApi({action:'toggle_referrals',enabled});setNotice('✅ تم التحديث');loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}})}
function processAffiliateCommissions(){tg.showConfirm('صرف عمولات الإحالات الأسبوعية الآن؟',async ok=>{if(!ok)return;try{const r=await bonusesApi({action:'process_affiliate_commissions'});setNotice(`✅ تم الفحص: ${fmt(r.checked||0)} | المستفيدون: ${fmt(r.paid_count||0)} | المدفوع: ${fmt(r.total_paid||0)} SYP`);loadBonuses();}catch(e){setNotice('❌ '+e.message,'error')}})}

<button class="btn outline" onclick="showTab('more')">🔙 رجوع</button>`;}

async function createPredictionCard(){try{await predictionsApi({action:'create',title:val('pred_title'),team_a:val('pred_team_a'),team_b:val('pred_team_b'),match_code:val('pred_match_code'),options:val('pred_options'),max_predictions:val('pred_max_predictions'),reward_syp:val('pred_reward_syp'),closes_at:val('pred_closes_at')});setNotice('✅ تم إنشاء البطاقة');loadPredictions();}catch(e){setNotice('❌ '+e.message,'error')}}

async function loadPredictionDetail(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل البطاقة...</div>';try{const d=await predictionsApi({action:'detail',card_id:id});renderPredictionDetail(d);}catch(e){document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadPredictions()">🔙 رجوع</button>`}}

function renderPredictionDetail(d){const c=d.card||{},entries=d.entries||[];document.getElementById('content').innerHTML=`

<div class="card"><div class="card-title">📊 التوزيع</div>${(c.summary||[]).map(s=>`<div class="row"><span class="label">${s.selected_option}</span><span class="value">${fmt(s.count)}</span></div>`).join('')||'<div class="empty">لا مشاركات</div>'}</div>
<div class="card"><div class="card-title">⚙️ إدارة</div>${c.status==='open'?`<button class="btn outline" onclick="closePredictionCard(${c.id})">🔒 إغلاق</button>`:''}${c.status!=='settled'?`<div class="field"><label>النتيجة الصحيحة</label><select id="pred_win_option">${(c.options||[]).map(op=>`<option value="${String(op).replaceAll('"','"')}">${op}</option>`).join('')}</select></div><button class="btn gold" onclick="settlePredictionCard(${c.id})">🏆 تسوية</button>`:''}<button class="btn outline" onclick="loadPredictions()">🔙 رجوع</button></div>
<div class="card"><div class="card-title">👥 المشاركون (${entries.length})</div>${entries.map(e=>`<div class="pending-item"><b>${e.telegram_username||e.user_telegram_id}</b><br>🎯 ${e.selected_option}${e.is_winner?` 🏆 ${fmt(e.reward_amount)} SYP`:''}<br><span class="label">${e.created_at}</span></div>`).join('')||'<div class="empty">لا مشاركون</div>'}</div>`;}

async function closePredictionCard(id){try{await predictionsApi({action:'close',card_id:id});setNotice('✅ تم الإغلاق');loadPredictionDetail(id);}catch(e){setNotice('❌ '+e.message,'error')}}
async function settlePredictionCard(id){const opt=val('pred_win_option');if(!opt){setNotice('اختر النتيجة','error');return}tg.showConfirm('تسوية وتوزيع الجوائز؟',async ok=>{if(!ok)return;try{await predictionsApi({action:'settle',card_id:id,winning_option:opt});setNotice('✅ تمت التسوية');loadPredictionDetail(id);}catch(e){setNotice('❌ '+e.message,'error')}})}

async function contestsApi(payload){return apiPost(CONTESTS_API,payload);}
async function loadContests(status='all'){currentTab='contests';setNavActive('more');document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل المسابقات...</div>';try{const d=await contestsApi({action:'list',status});renderContestsList(d,status);}catch(e){document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div>`}}

function renderContestsList(d,status='all'){const contests=d.contests||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">👑 مسابقات القيصر</div><div class="btn-row-3"><button class="btn outline" onclick="loadContests('open')">🟢 المفتوحة</button><button class="btn outline" onclick="loadContests('closed')">🔒 المغلقة</button><button class="btn outline" onclick="loadContests('all')">📋 الكل</button></div></div>
<div class="card"><div class="card-title">➕ إنشاء مسابقة</div><div class="field"><label>العنوان</label><input id="contest_title" placeholder="مثال: انشر البوت واربح"></div><div class="field"><label>الوصف</label><textarea id="contest_description" style="direction:rtl;text-align:right"></textarea></div><div class="field"><label>النوع</label><select id="contest_type"><option value="first_approved">أول المقبولين</option><option value="manual_review">مراجعة يدوية</option><option value="random_draw">سحب عشوائي</option></select></div><div class="field"><label>نوع الجائزة</label><select id="contest_reward_type"><option value="bonus_code">كود بونص للعب</option><option value="cash_code">كود كاش قابل للسحب</option></select><div class="hint">كود البونص يبدأ CAESAR-BONUS، وكود الكاش يبدأ CAESAR-CASH</div></div><div class="field"><label>قيمة الجائزة SYP</label><input id="contest_reward_amount" inputmode="numeric" value="0"></div><div class="field"><label>عدد الفائزين</label><input id="contest_winners_limit" inputmode="numeric" value="1"></div><div class="field"><label>يتطلب إثبات؟</label><select id="contest_requires_proof"><option value="true">نعم</option><option value="false">لا</option></select></div><button class="btn green" onclick="createContest()">✅ إنشاء</button></div>
<div class="card"><div class="card-title">📋 المسابقات (${contests.length})</div>${contests.map(c=>`<div class="pending-item" style="border-right-color:${c.status==='open'?'var(--green)':'var(--red)'}"><b>#${c.id} ${c.title}</b><br>🏆 ${c.reward_type} | 💰 ${fmt(c.reward_amount)} SYP | 👥 ${fmt(c.winners_limit)}<br>${c.status==='open'?'🟢 مفتوحة':'🔒 مغلقة'}<button class="btn outline" onclick="loadContestDetail(${c.id})">👁️</button></div>`).join('')||'<div class="empty">لا توجد مسابقات</div>'}</div>
<button class="btn outline" onclick="showTab('more')">🔙 رجوع</button>`;}

async function createContest(){try{await contestsApi({action:'create',title:val('contest_title'),description:val('contest_description'),contest_type:val('contest_type'),reward_type:val('contest_reward_type'),reward_amount:val('contest_reward_amount'),winners_limit:val('contest_winners_limit'),requires_proof:val('contest_requires_proof')});setNotice('✅ تم إنشاء المسابقة');loadContests();}catch(e){setNotice('❌ '+e.message,'error')}}

async function loadContestDetail(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل...</div>';try{const d=await contestsApi({action:'detail',contest_id:id});renderContestDetail(d);}catch(e){document.getElementById('content').innerHTML=`<div class="error-box">${e.message}</div><button class="btn outline" onclick="loadContests()">🔙 رجوع</button>`}}

function renderContestDetail(d){const c=d.contest||{},entries=d.entries||[];document.getElementById('content').innerHTML=`
<div class="card"><div class="card-title">👑 المسابقة #${c.id}</div><div class="row"><span class="label">العنوان</span><span class="value">${c.title||'—'}</span></div><div class="row"><span class="label">الحالة</span><span>${c.status==='open'?'🟢 مفتوحة':'🔒 مغلقة'}</span></div><div class="row"><span class="label">الجائزة</span><span class="value gold">${fmt(c.reward_amount)} SYP</span></div><div class="row"><span class="label">الفائزين</span><span class="value">${fmt(c.winners_limit)}</span></div><div class="hint">${c.description||''}</div>
${c.contest_type==='random_draw'&&c.status==='open'?`<div class="btn-row"><button class="btn gold" onclick="pickRandomContestWinners(${c.id},${c.winners_limit||1})">🎲 سحب عشوائي</button><button class="btn danger" onclick="closeContest(${c.id})">🔒 إغلاق</button></div>`:c.status==='open'?`<button class="btn danger" onclick="closeContest(${c.id})">🔒 إغلاق</button>`:''}
<button class="btn outline" onclick="loadContests()">🔙 رجوع</button></div>
<div class="card"><div class="card-title">👥 المشاركات (${entries.length})</div>${entries.map(e=>`<div class="pending-item" style="border-right-color:${e.status==='approved'?'var(--green)':e.status==='rejected'?'var(--red)':'var(--orange)'}"><b>${e.telegram_username||e.user_telegram_id}</b><br>📝 ${e.proof_text||'—'} | 📎 ${e.proof_type||'text'}<br>📌 ${e.status==='approved'?'✅ معتمدة':e.status==='rejected'?'❌ مرفوضة':'⏳ معلقة'}${e.gift_code?` | 🎫 <code>${e.gift_code}</code>`:''}${e.status==='pending'?`<div class="btn-row"><button class="btn green" onclick="approveContestEntry(${e.id},${c.id})">✅ اعتماد</button><button class="btn danger" onclick="rejectContestEntry(${e.id},${c.id})">❌ رفض</button></div>`:''}</div>`).join('')||'<div class="empty">لا مشاركات</div>'}</div>`;}

async function approveContestEntry(entryId,contestId){try{await contestsApi({action:'approve_entry',entry_id:entryId});setNotice('✅ تم الاعتماد');loadContestDetail(contestId);}catch(e){setNotice('❌ '+e.message,'error')}}
async function rejectContestEntry(entryId,contestId){try{await contestsApi({action:'reject_entry',entry_id:entryId});setNotice('✅ تم الرفض');loadContestDetail(contestId);}catch(e){setNotice('❌ '+e.message,'error')}}
async function pickRandomContestWinners(id,count){try{const d=await contestsApi({action:'random_pick',contest_id:id,winners_count:count});const winners=d.winners||[];if(!winners.length){setNotice('لا مشاركات كافية','error');return}setNotice('🎲 '+winners.map(w=>w.telegram_username||w.user_telegram_id).join(' | '));loadContestDetail(id);}catch(e){setNotice('❌ '+e.message,'error')}}
async function closeContest(id){tg.showConfirm('إغلاق المسابقة؟',async ok=>{if(!ok)return;try{await contestsApi({action:'close',contest_id:id});setNotice('✅ تم الإغلاق');loadContestDetail(id);}catch(e){setNotice('❌ '+e.message,'error')}})}

let currentCampaignCodes=[];
async function campaignsApi(payload){return apiPost(GIFT_CAMPAIGNS_API,payload)}
async function loadGiftCampaigns(){currentTab='campaigns';setNavActive('more');const el=document.getElementById('content');el.innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل الحملات...</div>';try{const d=await campaignsApi({action:'list'});giftCampaigns=d.campaigns||[];renderGiftCampaigns()}catch(e){el.innerHTML=`<div class="error-box">${esc(e.message)}</div>`}}
function campaignBudgetPreview(){
  const count=Math.max(0,parseInt(val('campaign_count'))||0);const mode=val('campaign_input_mode')||'per_code';const input=Math.max(0,parseInt(String(val('campaign_value')).replace(/,/g,''))||0);
  const per=mode==='total_budget'?(count?Math.floor(input/count):0):input;const total=per*count;const remainder=mode==='total_budget'?input-total:0;
  const box=document.getElementById('campaign_budget_preview');if(box)box.innerHTML=`عدد المستفيدين: <b>${fmt(count)}</b> × قيمة الاستفادة: <b>${fmt(per)} SYP</b><br>أقصى إنفاق محتمل: <b>${fmt(total)} SYP</b>${remainder?`<br><span class="hint">متبقٍ غير موزع: ${fmt(remainder)} SYP</span>`:''}`;
  return{count,mode,input,per,total,remainder};
}
function renderGiftCampaigns(){
  const cards=giftCampaigns.map(c=>{const pct=c.max_redemptions?Math.min(100,(c.redeemed_count/c.max_redemptions)*100):0;return `<div class="campaign-card"><div class="campaign-card-head"><b>#${c.id} ${esc(c.name)}</b><span class="pill ${c.status==='active'?'green':''}">${c.status==='active'?'نشطة':c.status==='paused'?'متوقفة':'مغلقة'}</span></div><div class="hint">${c.reward_type==='bonus'?'🎁 بونص':'💵 كاش'} • ${c.code_mode==='unique'?'أكواد فريدة':'كود مشترك'} • ${fmt(c.reward_amount)} لكل مستخدم</div><div class="campaign-progress"><span style="width:${pct}%"></span></div><div class="row"><span class="label">المستفيدون</span><span class="value">${c.redeemed_count} / ${c.max_redemptions}</span></div><div class="row"><span class="label">الميزانية القصوى</span><span class="value gold">${fmt(c.total_budget)} SYP</span></div><button class="btn outline" onclick="loadGiftCampaignDetail(${c.id})">👁️ الأكواد والإحصائيات</button></div>`}).join('')||'<div class="empty">لا توجد حملات بعد</div>';
  document.getElementById('content').innerHTML=`
  <div class="card"><div class="card-title">🎟️ حملات الأكواد التسويقية</div><div class="sub">استفادة واحدة لكل مستخدم داخل الحملة، مع توليد ونسخ آلي للأكواد.</div></div>
  <div class="card"><div class="card-title">➕ إنشاء حملة</div><div class="field"><label>اسم الحملة</label><input id="campaign_name" placeholder="مثال: حملة الافتتاح"></div><div class="cashier-form-grid"><div class="field"><label>نوع المكافأة</label><select id="campaign_reward_type"><option value="bonus">🎁 بونص لعب</option><option value="cash">💵 كاش قابل للسحب</option></select></div><div class="field"><label>شكل الأكواد</label><select id="campaign_code_mode"><option value="unique">دفعة أكواد فريدة</option><option value="shared">كود مشترك متعدد الاستخدام</option></select></div></div><div class="cashier-form-grid"><div class="field"><label>عدد المستفيدين/الأكواد</label><input id="campaign_count" inputmode="numeric" value="5" oninput="campaignBudgetPreview()"></div><div class="field"><label>طريقة تحديد القيمة</label><select id="campaign_input_mode" onchange="campaignBudgetPreview()"><option value="per_code">قيمة كل كود</option><option value="total_budget">إجمالي الميزانية</option></select></div></div><div class="cashier-form-grid"><div class="field"><label>القيمة المدخلة SYP</label><input id="campaign_value" inputmode="numeric" value="10000" oninput="campaignBudgetPreview()"></div><div class="field"><label>مدة الحملة بالساعات</label><input id="campaign_duration" inputmode="numeric" value="24"></div></div><div class="field"><label>يتطلب حساب iChancy؟</label><select id="campaign_requires_ichancy"><option value="true">نعم</option><option value="false">لا</option></select></div><div class="campaign-budget" id="campaign_budget_preview"></div><button class="btn gold" onclick="createGiftCampaign()">🎟️ إنشاء الأكواد</button></div>
  <div id="generatedCampaignCodes"></div><div class="card"><div class="card-title">📋 الحملات الحالية (${giftCampaigns.length})</div>${cards}</div><button class="btn outline" onclick="showTab('more')">🔙 رجوع</button>`;campaignBudgetPreview();
}
async function createGiftCampaign(){const preview=campaignBudgetPreview();if(!val('campaign_name').trim()||preview.count<1||preview.per<1000){setNotice('تحقق من الاسم والعدد والقيمة','error');return}tg.showConfirm(`إنشاء حملة بميزانية قصوى ${fmt(preview.total)} SYP؟`,async ok=>{if(!ok||adminActionBusy)return;adminActionBusy=true;try{const r=await campaignsApi({action:'create',name:val('campaign_name'),reward_type:val('campaign_reward_type'),code_mode:val('campaign_code_mode'),max_redemptions:preview.count,input_mode:preview.mode,input_value:preview.input,duration_hours:parseInt(val('campaign_duration'))||24,requires_ichancy:val('campaign_requires_ichancy')==='true'});const codes=r.codes||[];lastGeneratedCampaignCodes=codes;document.getElementById('generatedCampaignCodes').innerHTML=`<div class="card"><div class="card-title">✅ الأكواد جاهزة (${codes.length})</div><button class="btn green" onclick="copyText(lastGeneratedCampaignCodes.join('\n'))">⧉ نسخ جميع الأكواد</button><div class="generated-codes">${codes.map(c=>`<div class="generated-code"><code>${esc(c)}</code><button class="copy-mini" onclick="copyText(this.previousElementSibling.textContent)">نسخ</button></div>`).join('')}</div></div>`;setNotice('✅ تم إنشاء الحملة');const list=await campaignsApi({action:'list'});giftCampaigns=list.campaigns||[];}catch(e){setNotice('❌ '+e.message,'error')}finally{adminActionBusy=false}})}
async function loadGiftCampaignDetail(id){document.getElementById('content').innerHTML='<div class="loader"><div class="spinner"></div>جارٍ تحميل الحملة...</div>';try{const d=await campaignsApi({action:'detail',campaign_id:id});renderGiftCampaignDetail(d)}catch(e){setNotice('❌ '+e.message,'error');loadGiftCampaigns()}}
function renderGiftCampaignDetail(d){const c=d.campaign||{},codes=d.codes||[],reds=d.redemptions||[];currentCampaignCodes=codes.map(x=>x.code);document.getElementById('content').innerHTML=`<div class="card"><div class="card-title">🎟️ ${esc(c.name)}</div><div class="row"><span class="label">الحالة</span><span>${esc(c.status)}</span></div><div class="row"><span class="label">المستفيدون</span><span>${c.redeemed_count} / ${c.max_redemptions}</span></div><div class="row"><span class="label">قيمة الفرد</span><span class="gold">${fmt(c.reward_amount)} SYP</span></div><div class="btn-row-3"><button class="btn green" onclick="setGiftCampaignStatus(${c.id},'active')">تشغيل</button><button class="btn outline" onclick="setGiftCampaignStatus(${c.id},'paused')">إيقاف مؤقت</button><button class="btn danger" onclick="setGiftCampaignStatus(${c.id},'closed')">إغلاق</button></div></div><div class="card"><div class="card-title">🎫 الأكواد (${codes.length})</div><button class="btn outline" onclick="copyText(currentCampaignCodes.join('\n'))">نسخ الكل</button><div class="generated-codes">${codes.map(x=>`<div class="generated-code"><code>${esc(x.code)}</code><span class="pill">${x.redemptions_count}/${x.max_redemptions}</span><button class="copy-mini" onclick="copyText(this.parentElement.querySelector('code').textContent)">نسخ</button></div>`).join('')}</div></div><div class="card"><div class="card-title">👥 المستفيدون (${reds.length})</div>${reds.map(r=>`<div class="row"><span class="label">${esc(r.telegram_username||r.user_telegram_id)}</span><span class="value">${fmt(r.reward_amount)}</span></div>`).join('')||'<div class="empty">لا يوجد مستفيدون بعد</div>'}</div><button class="btn outline" onclick="loadGiftCampaigns()">🔙 رجوع</button>`}
function setGiftCampaignStatus(id,status){tg.showConfirm('تأكيد تغيير حالة الحملة؟',async ok=>{if(!ok)return;try{await campaignsApi({action:'set_status',campaign_id:id,status});setNotice('✅ تم تحديث الحالة');loadGiftCampaignDetail(id)}catch(e){setNotice('❌ '+e.message,'error')}})}
