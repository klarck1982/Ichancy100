      <div class="card">
        <div class="card-title">📊 لوحة الصدارة <span class="pill ${s.leaderboard_enabled!==false?'green':''}">${s.leaderboard_enabled!==false?'مفعّل':'متوقف'}</span></div>
        <div class="field"><label>الفترة</label><select id="lb_type"><option value="all_time" ${lbType==='all_time'?'selected':''}>كل الوقت</option><option value="weekly" ${lbType==='weekly'?'selected':''}>أسبوعي</option><option value="monthly" ${lbType==='monthly'?'selected':''}>شهري</option></select></div>
        <div class="btn-row">
          <button class="btn ${s.leaderboard_enabled!==false?'danger':'green'}" onclick="toggleFeature('leaderboard_enabled',${s.leaderboard_enabled!==false?'false':'true'})">${s.leaderboard_enabled!==false?'⛔ إيقاف الصدارة':'✅ تفعيل الصدارة'}</button>
          <button class="btn outline" onclick="saveLbType()">💾 حفظ الفترة</button>
        </div>
      </div>`;
  }

  document.getElementById('content').innerHTML=`
    <div class="card">
      <div class="card-title">✨ ميزات المستخدمين والمكافآت</div>
      <div class="sub">اختر القسم لفتح إعداداته المستقلة دون فوضى أو ازدحام بصري:</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;">
        <button class="btn ${currentFeatureSubTab==='vip'?'gold':'outline'}" style="flex:1;min-width:105px;padding:10px 4px;font-size:12px;" onclick="showFeatureSubTab('vip')">🏆 نظام VIP</button>
        <button class="btn ${currentFeatureSubTab==='wheel'?'gold':'outline'}" style="flex:1;min-width:105px;padding:10px 4px;font-size:12px;" onclick="showFeatureSubTab('wheel')">🎰 عجلة الحظ</button>
        <button class="btn ${currentFeatureSubTab==='flash'?'gold':'outline'}" style="flex:1;min-width:105px;padding:10px 4px;font-size:12px;" onclick="showFeatureSubTab('flash')">⚡ فلاش البونص</button>
        <button class="btn ${currentFeatureSubTab==='checkin'?'gold':'outline'}" style="flex:1;min-width:105px;padding:10px 4px;font-size:12px;" onclick="showFeatureSubTab('checkin')">📅 الحضور اليومي</button>
        <button class="btn ${currentFeatureSubTab==='cashback'?'gold':'outline'}" style="flex:1;min-width:105px;padding:10px 4px;font-size:12px;" onclick="showFeatureSubTab('cashback')">💸 الكاش باك</button>
        <button class="btn ${currentFeatureSubTab==='leaderboard'?'gold':'outline'}" style="flex:1;min-width:105px;padding:10px 4px;font-size:12px;" onclick="showFeatureSubTab('leaderboard')">📊 الصدارة</button>
      </div>
    </div>
    ${subContent}
    <button class="btn outline" style="margin-top:10px;" onclick="showTab('more')">🔙 رجوع</button>
  `;
}

async function toggleFeature(key,val){
  const payload={action:'update_features'};payload[key]=val;
  try{await apiPost(FEATURES_API,payload);setNotice('✅ تم التحديث');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function saveCheckinSettings(){
  const cycle=parseInt(document.getElementById('checkin_cycle_days').value)||30;
  const minDep=parseInt(document.getElementById('checkin_min_deposit').value)||50000;
  const reward=parseInt(document.getElementById('checkin_completion_reward').value)||20000;
  try{await apiPost(FEATURES_API,{action:'update_features',checkin_cycle_days:cycle,checkin_min_deposit:minDep,checkin_completion_reward:reward});setNotice('✅ تم حفظ إعدادات الحضور');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function saveLbType(){
  const t=document.getElementById('lb_type').value;
  try{await apiPost(FEATURES_API,{action:'update_features',leaderboard_type:t});setNotice('✅ تم حفظ الفترة');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function toggleWheel(en){
  try{await apiPost(FEATURES_API,{action:'update_wheel',wheel_enabled:en});setNotice('✅ تم التحديث');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function toggleVIP(en){
  try{await apiPost(FEATURES_API,{action:'update_vip',vip_enabled:en});setNotice('✅ تم التحديث');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function saveVIP(){
  const tiers=[];
  for(let i=0;i<4;i++){
    const thresh=parseInt(document.getElementById('vip_'+i+'_thresh').value)||0;
    const pct=parseFloat(document.getElementById('vip_'+i+'_pct').value)||0;
    const reward=parseInt(document.getElementById('vip_'+i+'_reward').value)||0;
    tiers.push([thresh,pct,reward]);
  }
  try{await apiPost(FEATURES_API,{action:'update_vip',tiers});setNotice('✅ تم حفظ طبقات VIP');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function toggleCashback(en){try{await apiPost(FEATURES_API,{action:"update_cashback",cashback_enabled:en});setNotice("✅ تم التحديث");loadFeatures();}catch(e){setNotice("❌ "+e.message,"error")}}
async function saveCashback(){const pct=parseFloat(document.getElementById("cb_pct").value)||0;const minLoss=parseInt(document.getElementById("cb_min").value)||0;try{await apiPost(FEATURES_API,{action:"update_cashback",cashback_pct:pct,cashback_min_loss:minLoss});setNotice("✅ تم حفظ إعدادات الكاش باك");loadFeatures();}catch(e){setNotice("❌ "+e.message,"error")}}
async function saveWheel(){
  const fixed=[[0,1,'PINGO'],[0,1,'0%'],[1,1,'+1%'],[2,1,'+2%'],[0,1,'0%'],[3,1,'+3%'],[4,1,'+4%'],[0,1,'0%']];
  const segments=[];
  for(let i=0;i<8;i++){
    const prob=parseFloat(document.getElementById('wseg_'+i+'_prob').value);
    segments.push([fixed[i][0], Number.isFinite(prob)?prob:0, fixed[i][2]]);
  }
  const total=segments.reduce((a,s)=>a+Math.max(0,s[1]),0);
  if(total<=0){setNotice('⚠️ مجموع الاحتمالات يجب أن يكون أكبر من صفر','error');return}
  try{await apiPost(FEATURES_API,{action:'update_wheel',segments});setNotice('✅ تم حفظ احتمالات العجلة');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function createFlash(){
  const percent=parseFloat(val('flash_percent'));const duration=parseInt(val('flash_duration'));const method=document.getElementById('flash_method').value;
  if(!percent||percent<=0){setNotice('أدخل نسبة صحيحة','error');return}
  try{await apiPost(FLASH_API,{action:'create',percent,duration_minutes:duration,payment_method:method});setNotice('⚡ تم إطلاق الفلاش!');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}
}
async function stopFlash(id){
  tg.showConfirm('إيقاف الفلاش الآن؟',async ok=>{if(!ok)return;try{await apiPost(FLASH_API,{action:'stop'});setNotice('🛑 تم الإيقاف');loadFeatures();}catch(e){setNotice('❌ '+e.message,'error')}})
}
