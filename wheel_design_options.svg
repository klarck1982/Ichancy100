<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" direction="rtl">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%"><stop offset="0" stop-color="#162033"/><stop offset="1" stop-color="#070a12"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd76a" flood-opacity="0.75"/></filter>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.45" stop-color="#ffd15c"/><stop offset="1" stop-color="#a66b00"/></linearGradient>
    <style>
      .title{font-family:Tahoma,Arial,sans-serif;font-weight:900;fill:#fff;font-size:38px;text-anchor:middle}
      .sub{font-family:Tahoma,Arial,sans-serif;fill:#b8c0d8;font-size:20px;text-anchor:middle}
      .cardTitle{font-family:Tahoma,Arial,sans-serif;font-weight:900;fill:#ffd76a;font-size:26px;text-anchor:middle}
      .small{font-family:Tahoma,Arial,sans-serif;fill:#d7def5;font-size:16px;text-anchor:middle}
      .tiny{font-family:Tahoma,Arial,sans-serif;fill:#aeb7d2;font-size:13px;text-anchor:middle}
      .label{font-family:Tahoma,Arial,sans-serif;font-weight:900;fill:white;font-size:15px;text-anchor:middle;dominant-baseline:middle}
      .panel{fill:rgba(255,255,255,0.045);stroke:rgba(255,255,255,0.13);stroke-width:1.5}
      .pill{fill:rgba(255,215,106,0.12);stroke:#ffd76a;stroke-width:1}
      .prob{font-family:Tahoma,Arial,sans-serif;fill:#cfd7ef;font-size:14px;text-anchor:middle}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="700" y="58" class="title">خيارات تطوير عجلة الحظ</text>
  <text x="700" y="92" class="sub">المؤشر يجب أن يقف في منتصف الخانة الفائزة — والاحتمالات قابلة للتعديل من لوحة المشرف</text>

  <!-- helper: cards -->
  <g transform="translate(65,130)">
    <rect class="panel" rx="26" width="390" height="690"/>
    <text x="195" y="42" class="cardTitle">الخيار 1: Royal Neon</text>
    <text x="195" y="70" class="tiny">فاخر — ذهبي/بنفسجي — مناسب لهوية القيصر</text>
    <g transform="translate(195,260)" filter="url(#shadow)">
      <circle r="154" fill="#0b1020" stroke="url(#gold)" stroke-width="10"/>
      <path d="M0,0 L0,-140 A140,140 0 0,1 98.99,-98.99 Z" fill="#4810a8"/>
      <path d="M0,0 L98.99,-98.99 A140,140 0 0,1 140,0 Z" fill="#0f8bd8"/>
      <path d="M0,0 L140,0 A140,140 0 0,1 98.99,98.99 Z" fill="#cc2d6f"/>
      <path d="M0,0 L98.99,98.99 A140,140 0 0,1 0,140 Z" fill="#f08c00"/>
      <path d="M0,0 L0,140 A140,140 0 0,1 -98.99,98.99 Z" fill="#13a66a"/>
      <path d="M0,0 L-98.99,98.99 A140,140 0 0,1 -140,0 Z" fill="#2b334e"/>
      <path d="M0,0 L-140,0 A140,140 0 0,1 -98.99,-98.99 Z" fill="#b9153f"/>
      <path d="M0,0 L-98.99,-98.99 A140,140 0 0,1 0,-140 Z" fill="#6e3cff"/>
      <circle r="54" fill="#11182b" stroke="url(#gold)" stroke-width="6"/>
      <text y="9" class="label" font-size="27">👑</text>
      <g class="label">
        <text x="54" y="-108" transform="rotate(22.5 54 -108)">+1%</text><text x="108" y="-54" transform="rotate(67.5 108 -54)">+2%</text>
        <text x="108" y="54" transform="rotate(112.5 108 54)">💔</text><text x="54" y="108" transform="rotate(157.5 54 108)">+3%</text>
        <text x="-54" y="108" transform="rotate(202.5 -54 108)">+5%</text><text x="-108" y="54" transform="rotate(247.5 -108 54)">💔</text>
        <text x="-108" y="-54" transform="rotate(292.5 -108 -54)">+10%</text><text x="-54" y="-108" transform="rotate(337.5 -54 -108)">💔</text>
      </g>
    </g>
    <polygon points="195,94 178,124 212,124" fill="url(#gold)" filter="url(#glowGold)"/>
    <rect class="pill" x="60" y="460" rx="18" width="270" height="42"/>
    <text x="195" y="487" class="small">متوسط كلفة تقريبي: 1.65%</text>
    <text x="195" y="535" class="prob">اقتراح احتمالات: 0%×50 — 1%×20 — 2%×15</text>
    <text x="195" y="562" class="prob">3%×8 — 5%×5 — 10%×2</text>
    <text x="195" y="615" class="tiny">أفضل خيار كبداية آمنة وجذابة بصرياً.</text>
  </g>

  <g transform="translate(505,130)">
    <rect class="panel" rx="26" width="390" height="690"/>
    <text x="195" y="42" class="cardTitle">الخيار 2: Premium Casino</text>
    <text x="195" y="70" class="tiny">كازينو كلاسيكي — أخضر داكن/ذهبي</text>
    <g transform="translate(195,260)" filter="url(#shadow)">
      <circle r="154" fill="#08160f" stroke="#d9a441" stroke-width="10"/>
      <path d="M0,0 L0,-140 A140,140 0 0,1 98.99,-98.99 Z" fill="#0c5c3a"/>
      <path d="M0,0 L98.99,-98.99 A140,140 0 0,1 140,0 Z" fill="#143d2c"/>
      <path d="M0,0 L140,0 A140,140 0 0,1 98.99,98.99 Z" fill="#b8860b"/>
      <path d="M0,0 L98.99,98.99 A140,140 0 0,1 0,140 Z" fill="#0c5c3a"/>
      <path d="M0,0 L0,140 A140,140 0 0,1 -98.99,98.99 Z" fill="#4b0f16"/>
      <path d="M0,0 L-98.99,98.99 A140,140 0 0,1 -140,0 Z" fill="#143d2c"/>
      <path d="M0,0 L-140,0 A140,140 0 0,1 -98.99,-98.99 Z" fill="#d9a441"/>
      <path d="M0,0 L-98.99,-98.99 A140,140 0 0,1 0,-140 Z" fill="#0c5c3a"/>
      <circle r="58" fill="#07120d" stroke="#e8c36a" stroke-width="6"/>
      <text y="9" class="label" font-size="27">♛</text>
      <g class="label"><text x="54" y="-108">+1%</text><text x="108" y="-54">💔</text><text x="108" y="54">+2%</text><text x="54" y="108">+5%</text><text x="-54" y="108">💔</text><text x="-108" y="54">+3%</text><text x="-108" y="-54">+15%</text><text x="-54" y="-108">💔</text></g>
    </g>
    <polygon points="195,94 178,124 212,124" fill="#e8c36a" filter="url(#glowGold)"/>
    <rect class="pill" x="60" y="460" rx="18" width="270" height="42"/>
    <text x="195" y="487" class="small">متوسط كلفة تقريبي: 2.25%</text>
    <text x="195" y="535" class="prob">اقتراح احتمالات: 0%×45 — 1%×20 — 2%×15</text>
    <text x="195" y="562" class="prob">3%×10 — 5%×8 — 15%×2</text>
    <text x="195" y="615" class="tiny">أكثر سخاءً؛ جيد للعروض القصيرة.</text>
  </g>

  <g transform="translate(945,130)">
    <rect class="panel" rx="26" width="390" height="690"/>
    <text x="195" y="42" class="cardTitle">الخيار 3: Glass Modern</text>
    <text x="195" y="70" class="tiny">حديث — أزرق/وردي — مناسب للـ Mini App</text>
    <g transform="translate(195,260)" filter="url(#shadow)">
      <circle r="154" fill="#0a1224" stroke="#8bd7ff" stroke-width="10"/>
      <path d="M0,0 L0,-140 A140,140 0 0,1 98.99,-98.99 Z" fill="#31b6ff"/>
      <path d="M0,0 L98.99,-98.99 A140,140 0 0,1 140,0 Z" fill="#1b2442"/>
      <path d="M0,0 L140,0 A140,140 0 0,1 98.99,98.99 Z" fill="#ff4fb2"/>
      <path d="M0,0 L98.99,98.99 A140,140 0 0,1 0,140 Z" fill="#7c5cff"/>
      <path d="M0,0 L0,140 A140,140 0 0,1 -98.99,98.99 Z" fill="#21d6a2"/>
      <path d="M0,0 L-98.99,98.99 A140,140 0 0,1 -140,0 Z" fill="#1b2442"/>
      <path d="M0,0 L-140,0 A140,140 0 0,1 -98.99,-98.99 Z" fill="#ffd166"/>
      <path d="M0,0 L-98.99,-98.99 A140,140 0 0,1 0,-140 Z" fill="#31b6ff"/>
      <circle r="58" fill="rgba(255,255,255,0.08)" stroke="#bdeeff" stroke-width="6"/>
      <text y="9" class="label" font-size="27">🎁</text>
      <g class="label"><text x="54" y="-108">+1%</text><text x="108" y="-54">💔</text><text x="108" y="54">+2%</text><text x="54" y="108">+3%</text><text x="-54" y="108">+7%</text><text x="-108" y="54">💔</text><text x="-108" y="-54">+20%</text><text x="-54" y="-108">💔</text></g>
    </g>
    <polygon points="195,94 178,124 212,124" fill="#8bd7ff" filter="url(#glowGold)"/>
    <rect class="pill" x="60" y="460" rx="18" width="270" height="42"/>
    <text x="195" y="487" class="small">متوسط كلفة تقريبي: 2.05%</text>
    <text x="195" y="535" class="prob">اقتراح احتمالات: 0%×50 — 1%×18 — 2%×14</text>
    <text x="195" y="562" class="prob">3%×10 — 7%×6 — 20%×2</text>
    <text x="195" y="615" class="tiny">مبهر بصرياً مع جائزة كبرى نادرة.</text>
  </g>

  <text x="700" y="860" class="sub">التعديل البرمجي المقترح: دوران العجلة إلى مركز القطاع الفائز باستخدام (index + 0.5) × زاوية القطاع، لا إلى حد القطاع.</text>
</svg>
