<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- تدرج ذهبي فاخر -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <!-- تدرج ذهبي للعكس -->
    <linearGradient id="goldGradientReverse" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <!-- تدرج خلفي داكن -->
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <!-- توهج ذهبي -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.6" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- توهج للنص -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.8" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- خلفية دائرية سوداء مع إطار ذهبي -->
  <circle cx="60" cy="60" r="56" fill="url(#darkGradient)" stroke="url(#goldGradient)" stroke-width="3" filter="url(#goldGlow)"/>

  <!-- حلقة ذهبية داخلية -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>

  <!-- التاج - أيقونة القيصر -->
  <g transform="translate(60, 48)" filter="url(#textGlow)">
    <path d="M-20,-8 L-20,-22 L-14,-14 L-8,-22 L-2,-14 L4,-22 L10,-14 L14,-22 L20,-14 L20,-8 Z" 
          fill="url(#goldGradient)" stroke="url(#goldGradientReverse)" stroke-width="1.5"/>
    <!-- نقاط التاج -->
    <circle cx="-17" cy="-24" r="2.5" fill="#FFF8DC"/>
    <circle cx="-5" cy="-26" r="2.5" fill="#FFF8DC"/>
    <circle cx="7" cy="-26" r="2.5" fill="#FFF8DC"/>
    <circle cx="19" cy="-24" r="2.5" fill="#FFF8DC"/>
    <!-- قاعدة التاج -->
    <rect x="-20" y="-8" width="40" height="4" fill="url(#goldGradient)"/>
    <rect x="-22" y="-4" width="44" height="3" fill="url(#goldGradientReverse)" opacity="0.8"/>
  </g>

  <!-- نص "ICHANCY" أو "CAESAR" صغير أسفل التاج -->
  <text x="60" y="88" text-anchor="middle" font-family="'Segoe UI', 'Arial Black', sans-serif" 
        font-size="11" font-weight="900" fill="url(#goldGradient)" letter-spacing="1.5" 
        style="filter: url(#textGlow);">ICHANCY</text>

  <!-- خط ذهبي فاصل صغير -->
  <line x1="60" y1="94" x2="60" y2="94" stroke="url(#goldGradient)" stroke-width="0" stroke-linecap="round">
    <animate attributeName="x1" from="60" to="30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="60" to="90" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>